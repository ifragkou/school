<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Μορφοποίηση με επιλογή εργαλείων</title>
<style>
  :root { --ink: #1b2a41; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #e8f1fb;
    color: #222;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }

  /* ---------- Επάνω μπάρα ---------- */
  .top {
    background: #2f7bd0;
    color: #fff;
    font-size: 22px;
    font-weight: bold;
    padding: 8px 16px;
    letter-spacing: .5px;
  }

  /* ---------- Εργαλειοθήκη ---------- */
  .toolbar {
    position: relative;
    z-index: 10;
    background: #fff;
    border-bottom: 3px solid #4a90d9;
    padding: 8px 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 12px;
    align-items: flex-end;
  }
  .group {
    display: flex;
    gap: 5px;
    align-items: flex-end;
    padding-right: 12px;
    border-right: 2px dashed #cfe0f3;
  }
  .group:last-child { border-right: none; padding-right: 0; }

  .tb {
    min-width: 58px;
    height: 62px;
    border: 2px solid #b9d3ee;
    background: #f4f9ff;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    font-size: 12px;
    color: var(--ink);
    gap: 2px;
    padding: 2px 6px;
  }
  .tb:hover { background: #dff0ff; }
  .tb:active { transform: translateY(1px); }
  .ic {
    font-size: 22px;
    line-height: 1.1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .bar {
    display: block;
    width: 24px;
    height: 4px;
    border-radius: 2px;
    margin-top: 1px;
    background: #000;
    border: 1px solid #99a;
  }
  .ctl {
    display: flex;
    flex-direction: column;
    font-size: 12px;
    gap: 3px;
    color: var(--ink);
  }
  select {
    height: 36px;
    font-size: 16px;
    border: 2px solid #b9d3ee;
    border-radius: 8px;
    background: #fff;
    padding: 0 6px;
    color: var(--ink);
  }

  /* ---------- Παλέτα χρωμάτων ---------- */
  .dd { position: relative; }
  .pop {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 6px;
    background: #fff;
    border: 3px solid #4a90d9;
    border-radius: 12px;
    padding: 10px;
    box-shadow: 0 6px 18px rgba(0,0,0,.28);
    z-index: 30;
  }
  .pop.open { display: block; }
  .pop-title { font-size: 13px; color: var(--ink); margin-bottom: 8px; font-weight: bold; }
  .swatches { display: grid; grid-template-columns: repeat(6, 36px); gap: 8px; }
  .sw {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 2px solid #fff;
    outline: 1px solid #889;
    cursor: pointer;
    padding: 0;
  }
  .sw:hover { transform: scale(1.12); outline: 2px solid #2f7bd0; }
  .swName, #swName {
    margin-top: 8px;
    text-align: center;
    font-size: 15px;
    font-weight: bold;
    color: var(--ink);
    min-height: 22px;
  }

  .tb.on { background: #ffe08a; border-color: #e0a800; }
  .nofill {
    margin-top: 10px;
    width: 100%;
    height: 34px;
    border: 2px solid #b9d3ee;
    background: #f4f9ff;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
  }
  .nofill:hover { background: #dff0ff; }

  /* ---------- Φύλλο εργασίας ---------- */
  .desk { flex: 1; overflow: auto; padding: 18px 12px 60px; }
  .paper {
    max-width: 1040px;
    margin: 0 auto;
    background: #fffef9;
    border-radius: 8px;
    box-shadow: 0 3px 14px rgba(40, 70, 110, .25);
    padding: 18px 20px 24px;
  }
  .paper h1 {
    margin: 0 0 4px;
    font-size: 26px;
    color: var(--ink);
  }
  .paper p.lead {
    margin: 0 0 16px;
    font-size: 19px;
    color: #33475f;
  }

  table.ex {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  table.ex th {
    background: #2f7bd0;
    color: #fff;
    font-size: 16px;
    padding: 8px 10px;
    border: 2px solid #2c3e5a;
    text-align: center;
  }
  table.ex td {
    border: 2px solid #2c3e5a;
    padding: 8px 10px;
    vertical-align: middle;
    background: #fff;
  }
  th:nth-child(1), td:nth-child(1) { width: 21%; }
  th:nth-child(2), td:nth-child(2) { width: 37%; }
  th:nth-child(3), td:nth-child(3) { width: 42%; }

  td.word {
    font-family: "Comic Sans MS", "Comic Neue", "Chalkboard SE", sans-serif;
    color: #222;
    line-height: 46px;
    text-align: center;
    overflow-wrap: anywhere;
  }

  /* Τα «κουμπιά» βοήθειας (μόνο για να τα βλέπει το παιδί) */
  .chips { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .chip {
    border: 2px solid #b9d3ee;
    background: #f4f9ff;
    border-radius: 10px;
    padding: 5px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    font-size: 12px;
    color: var(--ink);
    min-width: 96px;
    user-select: none;
    -webkit-user-select: none;
  }
  .chip .fake {
    min-width: 64px;
    height: 34px;
    line-height: 30px;
    border: 2px solid #b9d3ee;
    border-radius: 8px;
    background: #fff;
    font-size: 18px;
    font-weight: bold;
    text-align: center;
    padding: 0 10px;
  }
  .chip .ic { font-size: 22px; }
  .chip .val { font-size: 15px; font-weight: bold; }

  /* Το πεδίο όπου γράφει το παιδί */
  .ans { display: flex; align-items: center; gap: 8px; }
  .cell {
    flex: 1;
    min-width: 0;
    min-height: 58px;
    padding: 6px 12px;
    outline: none;
    border: 2px solid #b9d3ee;
    border-radius: 8px;
    background: #fff;
    font-family: "Comic Sans MS", "Comic Neue", "Chalkboard SE", sans-serif;
    font-size: 28px;
    line-height: 46px;
    color: var(--def, var(--ink));
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }
  .cell:focus { border-color: #2f7bd0; box-shadow: 0 0 0 3px rgba(47,123,208,.22); }
  .cell.empty::before {
    content: "Γράψε εδώ…";
    display: inline-block;
    font-weight: normal;
    font-style: normal;
    font-size: 18px;
    color: #b3bccb;
    pointer-events: none;
  }
  .status {
    flex: none;
    max-width: 120px;
    font-size: 14px;
    font-weight: bold;
    line-height: 1.2;
  }
  .status.ok { color: #2e7d32; }
  .status.bad { color: #c62828; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 90px;
    transform: translateX(-50%);
    background: #1b4f8f;
    color: #fff;
    font-size: 18px;
    font-weight: bold;
    padding: 10px 22px;
    border-radius: 24px;
    box-shadow: 0 4px 14px rgba(0,0,0,.3);
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
    text-align: center;
  }
  .toast.show { opacity: 1; }


  /* ---------- Καρουζέλ ---------- */
  .desk { padding-bottom: 24px; }
  table.ex.wide th:nth-child(1), table.ex.wide td:nth-child(1) { width: 19%; }
  table.ex.wide th:nth-child(2), table.ex.wide td:nth-child(2) { width: 54%; }
  table.ex.wide th:nth-child(3), table.ex.wide td:nth-child(3) { width: 27%; }
  table.ex.wide .chips { flex-wrap: nowrap; gap: 6px; }
  table.ex.wide .chip { min-width: 0; flex: 1 1 0; padding: 5px 4px; }
  table.ex.wide .chip { font-size: 11px; }
  table.ex.wide .chip .val { font-size: 12px; }
  table.ex.wide .chip .fake { min-width: 48px; padding: 0 6px; }
  table.ex.wide th:nth-child(2), table.ex.wide td:nth-child(2) { padding: 8px 4px; }
  table.ex.wide .ans { flex-direction: column; align-items: stretch; gap: 2px; }
  table.ex.wide .status { max-width: none; min-height: 17px; }
  .stage { flex: 1; min-height: 0; display: flex; align-items: stretch; gap: 8px; padding: 0 8px; }
  .stage .desk { flex: 1; min-width: 0; }
  .sidenav {
    flex: 0 0 auto; align-self: center; width: 52px; height: 52px; border-radius: 50%;
    border: none; background: #2f7bd0; color: #fff; font-size: 28px; cursor: pointer;
    box-shadow: 0 3px 0 #1d4ed8; font-family: inherit;
  }
  .sidenav:disabled { background: #b6c2d6; box-shadow: 0 3px 0 #94a3b8; cursor: default; }
  .dots { display: flex; justify-content: center; gap: 10px; padding: 8px 0 12px; }
  .dot { width: 16px; height: 16px; border-radius: 50%; background: #b9c8dc; border: none; cursor: pointer; padding: 0; }
  .dot.on { background: #2f7bd0; transform: scale(1.25); }
  .paper h2.ptitle { margin: 0 0 6px; font-size: 22px; color: var(--ink); }
  .ic.lst { font-size: 13px; line-height: 12px; align-items: flex-start; font-weight: bold; }
  .ic.lst span { display: block; }
  .panel { display: none; }
  .panel.show { display: block; }
  .chip .ic.letters { font-size: 22px; }

  /* ---------- Άσκηση 3: κείμενο προς μορφοποίηση ---------- */
  .tgrid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; align-items: start; }
  .tcell {
    min-height: 220px;
    padding: 12px 18px;
    border: 2px solid #b9d3ee;
    border-radius: 10px;
    background: #fff;
    font-family: "Comic Sans MS", "Comic Neue", "Chalkboard SE", sans-serif;
    font-weight: normal;
    color: #4A90E2;
    line-height: 1.8;
    outline: none;
    cursor: text;
  }
  .tpic { display: block; width: 70%; max-height: max(105px, calc((100dvh - 505px) * 0.7)); object-fit: contain; margin: 12px auto 0; border-radius: 10px; }
  .tcell:focus { border-color: #2f7bd0; box-shadow: 0 0 0 3px rgba(47,123,208,.22); }
  .tcell p { margin: 0 0 8px; }
  .tcell ::selection, .tcell::selection { background: #ffe08a; }
  .thead { margin: 0 0 8px; font-size: 20px; color: var(--ink); }
  .tasks { margin: 0; padding-left: 26px; font-size: 18px; line-height: 1.45; color: #222; }
  .tasks li { margin-bottom: 12px; }
  .tasks .say { display: block; }
  .tasks .status { display: block; max-width: none; min-height: 17px; margin-top: 2px; }
  .tnote { margin-top: 6px; font-size: 15px; font-weight: bold; color: #c62828; }
  @media (max-width: 760px) { .tgrid { grid-template-columns: 1fr; } }


  /* ---------- Άσκηση 3: πίνακας ονομάτων + οδηγίες ---------- */
  .tblgrid { grid-template-columns: auto minmax(0, 1fr); column-gap: 48px; margin-top: 30px; }
  .tblgrid .tcell { min-height: 0; padding: 10px; line-height: 1.5; }
  .tcell table.nt { border-collapse: collapse; }
  .tcell table.nt td { border: 2px solid #2c3e5a; text-align: center; padding: 20px 24px; white-space: nowrap; min-width: 110px; }
  .tblgrid .tright { justify-self: end; }
  .tright { display: flex; flex-direction: column; gap: 18px; justify-content: center; }
  .prow { display: flex; align-items: center; gap: 16px; }
  .prow img.kid { width: 91px; height: 97px; flex: none; }
  .ptools { display: flex; flex-wrap: nowrap; gap: 8px; align-items: stretch; }
  .sample { pointer-events: none; cursor: default; }
  /* τα εργαλεία βοήθειας ~20% μικρότερα· το «Μέγεθος γραμμάτων» μένει όπως στις Ασκήσεις 1 και 2 */
  .ptools .tb.sample { min-width: 54px; height: auto; font-size: 11px; padding: 4px 8px; gap: 3px; border-radius: 10px; }
  .ptools .tb.sample .ic { font-size: 26px; }
  .ptools .tb.sample .bar { width: 24px; height: 4px; }
  .ptools .chip { min-width: 0; padding: 5px 4px; font-size: 11px; }
  .ptools .chip .fake { min-width: 48px; padding: 0 6px; }

  /* ---------- Άσκηση 4: αντιγραφή κειμένου με μορφοποίηση ---------- */
  .chead { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 10px; }
  .chead .ptitle { margin: 0 0 4px; }
  .chead .lead { margin: 0; font-size: 17px; }
  .shoes { display: flex; gap: 10px; align-items: center; flex: none; }
  .shoes img { height: 56px; width: auto; mix-blend-mode: multiply; display: block; }
  .shoes img.plain { height: 70px; mix-blend-mode: normal; border-radius: 8px; border: 2px solid #b9d3ee; }
  .cgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: stretch; }
  .cleft, .cright { display: flex; flex-direction: column; min-width: 0; }
  .cgrid .thead { margin: 0 0 4px; font-size: 18px; }
  .cright { width: 100%; max-width: 1260px; margin: 2px auto 0; }
  .mcard { position: relative; width: 100%; max-width: 1260px; margin: 0 auto; padding: 66px 0; border: 2px solid #b9d3ee; border-radius: 10px; background: #fff; }
  .mtext { width: min(860px, 100% - 24px); margin: 0 auto; padding: 0; font-family: "Comic Sans MS", "Comic Neue", "Chalkboard SE", sans-serif;
    line-height: 2.1; text-align: justify; color: #000; user-select: none; -webkit-user-select: none; }
  .gut { position: relative; }
  .grp { position: absolute; display: flex; flex-direction: row; gap: 4px; }
  .grp .chip { min-width: 0; width: 38px; padding: 1px 2px; font-size: 8px; border-radius: 6px; gap: 0; text-align: center; gap: 2px; background: #f4f9ff; }
  .grp .chip .ic { font-size: 15px; line-height: 1.05; }
  .grp .chip .bar { width: 20px; height: 4px; border: none; }
  .grp .chip .val { display: none; }
  .grp .chip .fake { min-width: 0; width: 100%; height: 20px; line-height: 16px; font-size: 12px; padding: 0; border-radius: 5px; border-width: 1px; }
  .mcard svg.lines { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
  .wbox { flex: none; min-height: 230px; padding: 12px 18px; border: 3px solid #4a90d9; border-radius: 10px; background: #fff;
    font-family: "Comic Sans MS", "Comic Neue", "Chalkboard SE", sans-serif; line-height: 2.1;
    color: var(--def, #000); outline: none; cursor: text; overflow-wrap: anywhere; }
  .wbox:focus { border-color: #2f7bd0; box-shadow: 0 0 0 3px rgba(47,123,208,.22); }
  .wbox.empty::before { content: "Αντίγραψε εδώ το κείμενο…"; font-size: 18px; color: #b3bccb; pointer-events: none; }
  @media (max-width: 900px) {
    .cgrid { grid-template-columns: 1fr; }
    .chead { flex-direction: column; align-items: flex-start; }
  }

  @media (max-width: 760px) {
    .paper { padding: 12px; }
    .sidenav { width: 40px; height: 40px; font-size: 22px; }
    .stage { gap: 4px; padding: 0 4px; }
  }
</style>
</head>
<body>

<div class="top">✏️ Μορφοποίηση με επιλογή εργαλείων</div>

<div class="toolbar" id="toolbar">

  <div class="group">
    <button class="tb" data-act="undo" title="Αναίρεση"><span class="ic">↶</span>Αναίρεση</button>
  </div>

  <div class="group">
    <label class="ctl">Στυλ γραμμάτων
      <select id="fontSel"></select>
    </label>
    <label class="ctl">Μέγεθος γραμμάτων
      <select id="sizeSel"></select>
    </label>
  </div>

  <div class="group">
    <button class="tb" data-act="bold" id="bBold" title="Έντονα γράμματα"><span class="ic"><b>B</b></span>Έντονα</button>
    <button class="tb" data-act="italic" id="bItalic" title="Πλάγια γράμματα"><span class="ic"><i>I</i></span>Πλάγια</button>
    <button class="tb" data-act="underline" id="bUnder" title="Υπογραμμισμένα γράμματα"><span class="ic"><u>U</u></span>Υπογράμμιση</button>
  </div>

  <div class="group">
    <div class="dd">
      <button class="tb" id="btnColor" title="Χρώμα γραμμάτων"><span class="ic"><b>A</b><i class="bar" id="colorBar"></i></span>Χρώμα γραμμάτων</button>
      <div class="pop" id="popColor">
        <div class="pop-title">Διάλεξε χρώμα γραμμάτων</div>
        <div class="swatches" id="swColor"></div>
        <div class="swName" id="swName">&nbsp;</div>

  /* Άσκηση τύπου «αντιγραφή»: κείμενο-πρότυπο με εικονίδια βοήθειας + μεγάλο πλαίσιο όπου το παιδί γράφει και μορφοποιεί */
  /* πιο έντονα χρώματα για τη γραμμή κάτω από το Α στα εικονίδια βοήθειας */
  var BAR_COLORS = { '#0070C0': '#0033ff', '#00B050': '#00d000' };
  function makeChip(k, ex) {
    var c = mk('div', 'chip');
    if (k[0] === 'size') {
      c.title = 'Μέγεθος γραμμάτων';
      c.appendChild(mk('span', 'fake', String(k[1])));
    } else if (k[0] === 'color') {
      var ic = mk('span', 'ic');
      ic.appendChild(mk('b', '', 'A'));
      var bar = mk('i', 'bar');
      bar.style.background = BAR_COLORS[k[1]] || k[1];
      ic.appendChild(bar);
      c.appendChild(ic);
      c.title = 'Χρώμα γραμμάτων';
      c.appendChild(mk('span', 'val', colorName(ex.colors, k[1])));
    } else {
      var l = mk('span', 'ic letters');
      l.innerHTML = LETTER_INFO[k[0]][0];
      c.appendChild(l);
      c.appendChild(mk('span', 'val', LETTER_INFO[k[0]][1]));
    }
    return c;
  }
  function buildCopy(panel, box, ex, pi) {
    var grid = mk('div', 'cgrid');
    var left = mk('div', 'cleft'), right = mk('div', 'cright');
    var card = mk('div', 'mcard');
    var mt = mk('div', 'mtext');
    mt.style.fontSize = ex.baseSize + 'px';
    var spans = {};
    ex.segs.forEach(function (sg) {
      var sp = mk('span', '', sg.t);
      if (sg.b) sp.style.fontWeight = 'bold';
      if (sg.i) sp.style.fontStyle = 'italic';
      if (sg.u) sp.style.textDecoration = 'underline';
      if (sg.color) sp.style.color = sg.color;
      if (sg.size) { sp.style.fontSize = sg.size + 'px'; sp.style.lineHeight = '1.2'; }
      mt.appendChild(sp);
      if (sg.id) spans[sg.id] = sp;
    });
    card.appendChild(mt);
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'lines');
    svg.setAttribute('aria-hidden', 'true');
    card.appendChild(svg);
    panel.callouts = [];
    ex.callouts.forEach(function (co) {
      var g = mk('div', 'grp');
      co.chips.forEach(function (k) { g.appendChild(makeChip(k, ex)); });
      card.appendChild(g);
      panel.callouts.push({ el: g, pos: co.pos, follow: !!co.follow, dy: co.dy || 0, span: spans[co.id] });
    });
    left.appendChild(card);
    panel.card = card; panel.mt = mt; panel.svg = svg;

    right.appendChild(mk('h3', 'thead', '✏️ Αντίγραψέ το εδώ'));
    var ed = mk('div', 'wbox empty');
    ed.setAttribute('contenteditable', 'true');
    ed.setAttribute('spellcheck', 'false');
    ed.setAttribute('lang', 'el');
    ed.setAttribute('aria-label', 'Πλαίσιο για να αντιγράψεις το κείμενο');
    ed.dataset.p = pi;
    ed.dataset.i = 0;
    ed.style.fontSize = ex.baseSize + 'px';
    right.appendChild(ed);
    panel.cells.push(ed);
    grid.appendChild(left);
    grid.appendChild(right);
    box.appendChild(grid);
  }
  /* Τα εικονίδια βοήθειας μπαίνουν στις γωνίες γύρω από το κείμενο (TL πάνω-αριστερά, TR πάνω-δεξιά, BL κάτω-αριστερά, BR κάτω-δεξιά)
     και ενώνονται με διαγώνιες διακεκομμένες γραμμές με τον κύκλο γύρω από τη φράση τους */
  function layoutCallouts(p) {
    if (!p || !p.callouts) return;
    var card = p.card, cr = card.getBoundingClientRect();
    if (!cr.width) return;
    var NS = 'http://www.w3.org/2000/svg', svg = p.svg;
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var mr = p.mt.getBoundingClientRect();
    var mL = mr.left - cr.left, mR = cr.right - mr.right;
    var gray = '#a3adba';
    p.callouts.forEach(function (c) {
      var v = c.pos.charAt(0), h = c.pos.charAt(1), top = v === 'T', lft = h === 'L';
      var fy = null;
      if (v === 'M' && c.follow) {
        var fq = document.createRange(); fq.selectNodeContents(c.span);
        var frs = Array.prototype.slice.call(fq.getClientRects());
        var fr = frs.reduce(function (a, r) { return (lft ? r.left < a.left : r.right > a.right) ? r : a; });
        fy = Math.min(Math.max(0, fr.top - cr.top - 8 - c.el.offsetHeight / 2 + (c.dy || 0)), cr.height - c.el.offsetHeight);
      }
      c.el.style.top = v === 'T' ? '12px' : (v === 'M' ? (fy !== null ? fy : Math.max(0, (cr.height - c.el.offsetHeight) / 2)) + 'px' : '');
      c.el.style.bottom = v === 'B' ? '12px' : '';
      c.el.style.left = h === 'L' ? Math.max(6, mL - 110) + 'px' : (h === 'M' ? (function () { var q = document.createRange(); q.selectNodeContents(c.span); var r0 = q.getClientRects()[0]; var cx = (r0.left + r0.right) / 2 - cr.left; return Math.min(Math.max(6, cx - c.el.offsetWidth / 2), cr.width - c.el.offsetWidth - 6); })() + 'px' : (h === 'C' ? Math.max(0, cr.width * 0.68 - c.el.offsetWidth / 2) + 'px' : ''));
      c.el.style.right = h === 'R' ? Math.max(6, mR - 110) + 'px' : '';
      var g = document.createRange();
      g.selectNodeContents(c.span);
      var rs = Array.prototype.slice.call(g.getClientRects());
      rs.forEach(function (r) {
        var ov = document.createElementNS(NS, 'rect');
        ov.setAttribute('x', r.left - cr.left - 4); ov.setAttribute('y', r.top - cr.top - 1);
        ov.setAttribute('width', r.width + 8); ov.setAttribute('height', r.height + 3);
        ov.setAttribute('rx', (r.height + 3) / 2);
        ov.setAttribute('fill', 'none'); ov.setAttribute('stroke', gray); ov.setAttribute('stroke-width', '1.5'); ov.setAttribute('stroke-dasharray', '5 4');
        svg.appendChild(ov);
      });
      var gr = c.el.getBoundingClientRect();
      var x1 = (h === 'M' || h === 'C' || v !== 'M') ? (gr.left + gr.right) / 2 - cr.left : (lft ? gr.right : gr.left) - cr.left;
      var y1 = v === 'M' ? (gr.top + gr.bottom) / 2 - cr.top : (top ? gr.bottom : gr.top) - cr.top;
      var rect = rs.reduce(function (a, r) {
        function d(q) {
          var qx = Math.min(Math.max(x1 + cr.left, q.left), q.right), qy = v === 'M' ? q.bottom : (top ? q.top : q.bottom);
          return Math.hypot(qx - (x1 + cr.left), qy - (y1 + cr.top));
        }
        return d(r) < d(a) ? r : a;
      });
      var x2 = Math.min(Math.max(x1, rect.left - cr.left + 12), rect.right - cr.left - 12);
      var y2 = (top ? rect.top - 1 : rect.bottom + 2) - cr.top;
      if (v === 'M') { top = y1 < (rect.top + rect.bottom) / 2 - cr.top; y2 = (top ? rect.top - 1 : rect.bottom + 2) - cr.top; }
      var ln = document.createElementNS(NS, 'line');
      ln.setAttribute('x1', x1); ln.setAttribute('y1', y1); ln.setAttribute('x2', x2); ln.setAttribute('y2', y2);
      ln.setAttribute('stroke', gray); ln.setAttribute('stroke-width', '1.5'); ln.setAttribute('stroke-dasharray', '5 4');
      svg.appendChild(ln);
      var dot = document.createElementNS(NS, 'circle');
      dot.setAttribute('cx', x2); dot.setAttribute('cy', y2); dot.setAttribute('r', 2.5); dot.setAttribute('fill', gray);
      svg.appendChild(dot);
    });
    svg.setAttribute('width', cr.width);
    svg.setAttribute('height', cr.height);
  }

  /* Αντίγραφο του κουμπιού της γραμμής εργαλείων (ίδια εμφάνιση, με την περιγραφή), μόνο για να το βλέπουν ως οδηγία */
  function makeMenuTool(k, ex) {
    if (k[0] === 'size') {   /* ίδιο με τις Ασκήσεις 1 και 2: ετικέτα + πλαίσιο με το μέγεθος */
      var sc = mk('div', 'chip');
      sc.appendChild(mk('span', '', 'Μέγεθος γραμμάτων'));
      sc.appendChild(mk('span', 'fake', String(k[1])));
      return sc;
    }
    var b = mk('div', 'tb sample');
    if (k[0] === 'color') {
      var ic = mk('span', 'ic');
      ic.appendChild(mk('b', '', 'A'));
      var bar = mk('i', 'bar');
      bar.style.background = BAR_COLORS[k[1]] || k[1];
      ic.appendChild(bar);
      b.appendChild(ic);
      b.appendChild(document.createTextNode('Χρώμα γραμμάτων'));
    } else {
      var l = mk('span', 'ic');
      l.innerHTML = LETTER_INFO[k[0]][0];
      b.appendChild(l);
      b.appendChild(document.createTextNode(LETTER_INFO[k[0]][1]));
    }
    return b;
  }

  /* Άσκηση τύπου «πίνακας»: πίνακας με ονόματα (μόνο μορφοποίηση, όχι αλλαγή γραμμάτων) + οδηγίες με εικονίδια δίπλα */
  function buildTbl(panel, box, ex, pi) {
    var grid = mk('div', 'tgrid tblgrid');
    var left = mk('div', 'tleft');
    var ed = mk('div', 'tcell');
    ed.setAttribute('contenteditable', 'true');
    ed.setAttribute('spellcheck', 'false');
    ed.setAttribute('inputmode', 'none');
    ed.setAttribute('lang', 'el');
    ed.setAttribute('aria-label', 'Πίνακας για μορφοποίηση');
    ed.dataset.p = pi;
    ed.dataset.i = 0;
    ed.style.fontSize = ex.baseSize + 'px';
    ed.style.color = '#000';
    var table = mk('table', 'nt'), tb = mk('tbody');
    ex.names.forEach(function (row) {
      var tr = mk('tr');
      row.forEach(function (n) { tr.appendChild(mk('td', '', n)); });
      tb.appendChild(tr);
    });
    table.appendChild(tb);
    ed.appendChild(table);

    if (isEmptyCell(c)) { st.textContent = 'Γράψε τη λέξη'; st.classList.add('bad'); return false; }
    var bad = [];
    var txt = c.textContent.replace(/[\s​]+/g, ' ').trim();
    if (txt !== want[0]) bad.push('λέξη');
    var sizeOk = true, colorOk = true, boldOk = true, italicOk = true, underOk = true;

    if (!italicOk) bad.push('πλάγια');
    if (!underOk) bad.push('υπογράμμιση');
    if (!bad.length) { st.textContent = '✔ Μπράβο!'; st.classList.add('ok'); return true; }
    st.textContent = '✘ Δες ξανά: ' + bad.join(', ');
    st.classList.add('bad');
    return false;
  }
  /* Έλεγχος της Άσκησης 3: κάθε λέξη-στόχος πρέπει να έχει ακριβώς τις μορφοποιήσεις της οδηγίας */
  function checkTextPanel(pi) {
    var p = panels[pi], ed = p.cells[0], ex = p.ex;
    var chars = [], n;
    var w = document.createTreeWalker(ed, NodeFilter.SHOW_TEXT);
    while ((n = w.nextNode())) {
      var el = n.parentElement, cs = window.getComputedStyle(el);
      var info = {
        b: parseInt(cs.fontWeight, 10) >= 600 || cs.fontWeight === 'bold',
        i: cs.fontStyle === 'italic' || cs.fontStyle === 'oblique',
        u: hasUnderline(el, ed),
        color: cs.color.replace(/\s+/g, ''),
        size: parseFloat(cs.fontSize)
      };
      for (var k = 0; k < n.nodeValue.length; k++) chars.push({ ch: n.nodeValue.charAt(k), info: info });
    }
    var full = chars.map(function (c) { return c.ch; }).join('');
    var defColor = hexToRgb(ex.textColor).replace(/\s+/g, '');
    var target = [], ok = 0;
    ex.tasks.forEach(function (t, ti) {
      var st = p.statuses[ti];
      st.className = 'status';
      var s = full.indexOf(t.word);
      if (s < 0) { st.textContent = '✘ Η λέξη λείπει'; st.classList.add('bad'); return; }
      var flags = t.flags || '';
      var wantColor = hexToRgb(t.color || ex.textColor).replace(/\s+/g, '');
      var wantSize = t.size || ex.baseSize;
      var bad = [];
      function flag(name) { if (bad.indexOf(name) < 0) bad.push(name); }
      for (var j = s; j < s + t.word.length; j++) {
        target[j] = true;
        var f = chars[j].info;
        if (Math.abs(f.size - wantSize) > 0.5) flag('μέγεθος');
        if (f.color !== wantColor) flag('χρώμα');
        if (f.b !== (flags.indexOf('B') >= 0)) flag('έντονα');
        if (f.i !== (flags.indexOf('I') >= 0)) flag('πλάγια');
        if (f.u !== (flags.indexOf('U') >= 0)) flag('υπογράμμιση');
      }
      if (!bad.length) { st.textContent = '✔ Μπράβο!'; st.classList.add('ok'); ok++; }
      else { st.textContent = '✘ Δες ξανά: ' + bad.join(', '); st.classList.add('bad'); }
    });
    var extra = false;
    for (var q = 0; q < full.length && !extra; q++) {
      if (target[q] || !/\S/.test(full.charAt(q))) continue;
      var g = chars[q].info;
      if (g.b || g.i || g.u || g.color !== defColor || Math.abs(g.size - ex.baseSize) > 0.5) extra = true;
    }
    p.note.textContent = extra ? 'Πρόσεξε: μορφοποίησες και άλλες λέξεις που δεν χρειαζόταν.' : '';
    var total = ex.tasks.length;
    if (ok === total && !extra) toast('Μπράβο! Τα έκανες όλα σωστά! 🎉');
    else if (ok === total) toast('Οι λέξεις είναι σωστές, αλλά μορφοποίησες και άλλες λέξεις');
    else toast('Σωστά: ' + ok + ' από ' + total);
  }

  /* ---------- Καρουζέλ ---------- */
  var dotsEl = $('dots'), dotBtns = [];
  EXERCISES.forEach(function (ex, i) {
    var d = mk('button', 'dot');
    d.type = 'button';
    d.title = ex.title;
    d.setAttribute('aria-label', ex.title);
    d.addEventListener('click', function () { go(i); });
    dotsEl.appendChild(d);
    dotBtns.push(d);
  });
  function go(n) {
    if (n < 0 || n >= panels.length) return;
    cur = n;
    savedRange = null;
    closePops();
    panels.forEach(function (p, i) { p.box.classList.toggle('show', i === cur); });
    dotBtns.forEach(function (d, i) { d.classList.toggle('on', i === cur); });
    $('prevBtn').disabled = cur === 0;
    $('nextBtn').disabled = cur === panels.length - 1;
    buildColorPalette();
    currentPx = EXERCISES[cur].baseSize || DEFAULT_PX;
    sizeSel.value = currentPx;
    $('colorBar').style.background = EXERCISES[cur].colors[2][0]; /* η γραμμή κάτω από το Α είναι κόκκινη, όπως στο Word */
    $('swName').innerHTML = '&nbsp;';
    paper.style.maxWidth = EXERCISES[cur].paperWidth || '';
    document.querySelector('.desk').scrollTop = 0;
    layoutCallouts(panels[cur]);
    requestAnimationFrame(function () { layoutCallouts(panels[cur]); });
  }
  window.addEventListener('resize', function () { layoutCallouts(panels[cur]); });
  window.addEventListener('load', function () { layoutCallouts(panels[cur]); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { layoutCallouts(panels[cur]); });
  $('prevBtn').addEventListener('click', function () { go(cur - 1); });
  $('nextBtn').addEventListener('click', function () { go(cur + 1); });

  go(0);
  afterChange();
})();
</script>
</body>
