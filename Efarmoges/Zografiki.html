<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Η Ζωγραφική μου</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS","Segoe UI",sans-serif;color:#37474f}
body{background:linear-gradient(#a9dcff,#e6f6ff 60%,#d8f3d2)}
#deco{position:fixed;inset:0;z-index:0;pointer-events:none;background:
 radial-gradient(circle 1000px at 80% 118%,transparent 0 56%,#ff9e9e 56% 60%,#ffcf9e 60% 64%,#fff6a8 64% 68%,#b8f0b0 68% 72%,#a6dcff 72% 76%,#c8b6ff 76% 80%,transparent 80%),
 radial-gradient(ellipse 45% 22% at 10% 108%,#9bdc86 0 99%,transparent 100%),
 radial-gradient(ellipse 50% 26% at 92% 112%,#86cf80 0 99%,transparent 100%),
 radial-gradient(ellipse 14% 6% at 22% 14%,rgba(255,255,255,.9) 0 99%,transparent 100%),
 radial-gradient(ellipse 12% 5% at 72% 9%,rgba(255,255,255,.8) 0 99%,transparent 100%),
 linear-gradient(#a9dcff,#e6f6ff 60%,#d8f3d2)}
#app{position:relative;z-index:1;display:grid;height:100%;padding:14px 16px 10px;gap:12px;grid-template-columns:auto minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr) auto}
#tools{grid-area:1/1;display:grid;grid-template-columns:repeat(2,100px);gap:9px;align-content:start;overflow-y:auto;padding:4px;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
#center{grid-area:1/2;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
#panel{grid-area:1/3;background:rgba(255,255,255,.74);border:3px solid #fff;border-radius:26px;padding:12px 14px;overflow-y:auto;box-shadow:0 4px 14px rgba(0,0,0,.1)}
#palette{grid-area:2/1/3/4;background:rgba(255,255,255,.8);border:3px solid #fff;border-radius:32px;padding:9px 16px;display:flex;justify-content:center;align-items:center;gap:9px;overflow-x:auto;box-shadow:0 4px 14px rgba(0,0,0,.1)}
.tb{width:100px;height:76px;border:3px solid #ffd54f;border-bottom-width:5px;border-radius:16px;background:linear-gradient(#fffdf5,#fff3cf);font:inherit;font-size:13px;font-weight:700;color:#455a64;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:0 2px;box-shadow:0 3px 6px rgba(0,0,0,.12)}
.tb .ic{font-size:30px;line-height:32px;height:32px;display:flex;align-items:center;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.tb .ic svg{width:30px;height:30px}
.tb.sel{background:linear-gradient(#ffe9a0,#ffd45c);border-color:#ffab00}
.tb:active{transform:scale(.95)}
.tb.dis{opacity:.4;pointer-events:none}
.ptitle{text-align:center;font-size:25px;font-weight:800;color:#ec407a;margin:2px 0 10px}
.lbl{font-size:13px;font-weight:800;color:#546e7a;letter-spacing:.08em;margin:12px 0 6px}
.grid4{display:grid;grid-template-columns:repeat(4,62px);gap:8px;justify-content:center}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:3px solid #e1e6ea;background:#fff;border-radius:14px;font:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;padding:0;min-width:56px;height:50px;color:#37474f}
.opt.sel{background:#ffe08a;border-color:#ffb300}
.opt:active{transform:scale(.95)}
.grid4 .opt{width:62px;height:56px;min-width:0}
.opt canvas{width:52px;height:41px;display:block}
.opt .dot{display:block;border-radius:50%;background:#37474f}
.opt b{font-size:13px}
.opt.stamp{font-size:34px;line-height:1;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{min-width:0;width:46px;height:42px;font-size:22px;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.catname{font-weight:800;color:#546e7a;text-align:center;margin:10px 0 6px}
.thumb{border:3px solid #e1e6ea;background:#fff;border-radius:14px;padding:4px;cursor:pointer;font:inherit;font-size:13px;font-weight:700;color:#455a64}
.thumb img{width:100%;display:block;border-radius:8px;aspect-ratio:3/2;background:#fff}
.thumb.sel{border-color:#ffb300;background:#fff3c4}
.tip{font-size:15px;line-height:1.45;color:#546e7a;text-align:center;margin:6px 4px}
.tip big{display:block;font-size:46px}
input[type=range]{width:100%;accent-color:#ec407a;height:28px}
.objctl.off{display:none}
.opt.act{flex-direction:column;gap:0;font-size:22px;height:58px;min-width:70px;flex:1}
.opt.act small{font-size:11px;font-weight:800}
.sw{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:4px solid #b0bec5;cursor:pointer;padding:0;transition:transform .1s}
.sw.sel{transform:scale(1.3);border-color:#ff8f00;box-shadow:0 0 0 3px #fff}
#stage{position:relative;background:#fff;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.22);overflow:hidden;touch-action:none}
.cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#ov{touch-action:none}
#bar{position:absolute;display:none;gap:8px;transform:translateX(-50%);z-index:5;background:rgba(255,255,255,.93);padding:6px 8px;border-radius:30px;box-shadow:0 3px 10px rgba(0,0,0,.28)}
#bar button{width:48px;height:48px;border-radius:50%;border:3px solid #ffb300;background:#fff3c4;font-size:22px;cursor:pointer;padding:0;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
#bar button:active{transform:scale(.9)}
#fsBtn{position:fixed;top:6px;right:6px;z-index:15;width:36px;height:36px;padding:0;border:3px solid #ffd54f;border-radius:50%;background:linear-gradient(#fffdf5,#fff3cf);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
#fsBtn:active{transform:scale(.92)}
#fsBtn svg{width:20px;height:20px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:center;justify-content:center}
#modal.off{display:none}
#modal .box{background:#fff;border-radius:26px;padding:22px 28px;text-align:center;max-width:90vw;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#modal .mt{font-size:28px;font-weight:800;color:#ec407a}
#modal p{font-size:18px;margin:10px 0 18px}
#modal button{font:inherit;font-size:18px;font-weight:800;border:3px solid #ffb300;background:#ffe08a;border-radius:18px;padding:12px 20px;cursor:pointer}
#modal button.no{background:#e3f2fd;border-color:#64b5f6}
#toast{position:fixed;left:50%;top:22px;transform:translateX(-50%) translateY(-90px);background:#43a047;color:#fff;font-weight:800;font-size:20px;padding:12px 24px;border-radius:30px;z-index:30;transition:transform .3s;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#toast.on{transform:translateX(-50%) translateY(0)}
@media (max-width:1100px){#app{grid-template-columns:auto minmax(0,1fr) 240px;gap:8px;padding:8px}.tb{width:80px;height:62px;font-size:11px}#tools{grid-template-columns:repeat(2,80px);gap:6px}.tb .ic{font-size:24px;height:26px}.tb .ic svg{width:24px;height:24px}.grid4{grid-template-columns:repeat(3,62px)}.sw{width:34px;height:34px}}
@media (max-height:720px){.tb{height:58px;font-size:11px}.tb .ic{font-size:22px;height:24px}.tb .ic svg{width:22px;height:22px}.sw{width:36px;height:36px}#tools{gap:6px}}
</style>
</head>
<body>
<div id="deco"></div>
<div id="app">
 <div id="tools">
  <button class="tb" data-tool="new"><span class="ic">📄</span>Νέο</button>
  <button class="tb" data-tool="brush"><span class="ic">🖌️</span>Πινέλο</button>
  <button class="tb" data-tool="stamp"><span class="ic">🐶</span>Σφραγίδες</button>
  <button class="tb" data-tool="shape"><span class="ic">🔷</span>Σχήματα</button>
  <button class="tb" data-tool="line"><span class="ic">📏</span>Γραμμή</button>
  <button class="tb" data-tool="fill"><span class="ic"><svg viewBox="0 0 32 32"><path d="M5 15L15 5l10 10-8 8a3 3 0 0 1-4 0z" fill="#29b6f6" stroke="#0277bd" stroke-width="1.5" stroke-linejoin="round"/><path d="M13 5.5c-3-3-7 0-5 4" fill="none" stroke="#546e7a" stroke-width="1.8" stroke-linecap="round"/><path d="M27 17c1.5 2.4 2.6 3.8 2.6 5.4a2.6 2.6 0 0 1-5.2 0c0-1.6 1.1-3 2.6-5.4z" fill="#29b6f6"/></svg></span>Γέμισμα</button>
  <button class="tb" data-tool="eraser"><span class="ic">🧽</span>Γόμα</button>
  <button class="tb" data-cmd="undo" id="bUndo"><span class="ic">↩️</span>Αναίρεση</button>
  <button class="tb" data-cmd="redo" id="bRedo"><span class="ic">↪️</span>Επανάληψη</button>
  <button class="tb" data-cmd="save" style="grid-column:1/3;width:auto"><span class="ic">💾</span>Αποθήκευση</button>
 </div>
 <div id="center">
  <div id="stage">
   <canvas id="cvBg" class="cv"></canvas>
   <canvas id="cvPaint" class="cv"></canvas>
   <canvas id="cvObj" class="cv"></canvas>
   <canvas id="cvLine" class="cv"></canvas>
   <canvas id="ov" class="cv"></canvas>
   <div id="bar">
    <button data-act="flip" title="Γύρνα το από την άλλη πλευρά">⇄</button>
    <button data-act="done" title="Έτοιμο">✓</button>
    <button data-act="del" title="Σβήσε το">🗑️</button>
   </div>
  </div>
 </div>
 <div id="panel"></div>
 <div id="palette"></div>
</div>
<div id="modal" class="off"><div class="box"><div class="mt" id="mT">Νέο χαρτί;</div><p id="mP">Η ζωγραφιά σου θα σβηστεί.</p><div class="row" style="justify-content:center"><button id="mYes">Ναι, νέο χαρτί</button><button id="mNo" class="no">Όχι, πίσω</button></div></div></div>
<button id="fsBtn" title="Πλήρης οθόνη" aria-label="Πλήρης οθόνη"><svg id="fsIn" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="#455a64" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><svg id="fsOut" viewBox="0 0 24 24" style="display:none"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" fill="none" stroke="#455a64" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<div id="toast"></div>

<script>
(function(){
'use strict';
var newView=null,dirty=false,pending=null,W=1200,H=800,PI2=Math.PI*2,MIN=24;
var $=function(id){return document.getElementById(id)};
var EMO='"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif';
function R(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

/* ---------- canvases ---------- */
var cvBg=$('cvBg'),cvPaint=$('cvPaint'),cvObj=$('cvObj'),cvLine=$('cvLine'),ov=$('ov');
[cvBg,cvPaint,cvObj,cvLine,ov].forEach(function(c){c.width=W;c.height=H});
var bgx=cvBg.getContext('2d'),px=cvPaint.getContext('2d',{willReadFrequently:true}),obx=cvObj.getContext('2d'),lnx=cvLine.getContext('2d',{willReadFrequently:true}),ovx=ov.getContext('2d');
var disp=1;
function fit(){var c=$('center');var aw=c.clientWidth,ah=c.clientHeight;if(!aw||!ah)return;var s=Math.min(aw/W,ah/H);var st=$('stage');st.style.width=Math.floor(W*s)+'px';st.style.height=Math.floor(H*s)+'px';disp=Math.floor(W*s)/W;renderOv();placeBar()}
function u(){return 1/Math.max(.1,disp)}

/* ---------- state ---------- */
var COLORS=['#000000','#ffffff','#9e9e9e','#795548','#f44336','#ff9800','#ffeb3b','#8bc34a','#2e7d32','#4fc3f7','#1e88e5','#3f51b5','#9c27b0','#f48fb1','#ffcc80','#00bfa5'];
var tool='brush',color='#f44336',curBrush='round',stampCat=0,stampCh=null,shapeId=null,shapeMode='fill',lineStyle=null;
var SZ={brush:1,erase:1,line:1,stamp:1,shape:1,lw:1};
var BR=[8,16,32,60],ER=[18,40,80,140],LN=[4,9,18,32],ST=[110,180,280,420],SH=[130,220,340,500],LW=[6,12,22];
var obj=null,hover=null,drag=null,bgId='none',pageId=null,ptype='mouse';
var undoS=[],redoS=[];

/* ---------- colours ---------- */
var RB=['#f44336','#ff9800','#ffeb3b','#4caf50','#2196f3','#3f51b5','#9c27b0'];
function rainbowGrad(c,x1,y1,x2,y2){var g=c.createLinearGradient(x1,y1,x2,y2);RB.forEach(function(k,i){g.addColorStop(i/(RB.length-1),k)});return g}
function hsl2rgb(h,s,l){h=((h%360)+360)%360/360;var a=s*Math.min(l,1-l);var f=function(n){var k=(n+h*12)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return[Math.round(f(0)*255),Math.round(f(8)*255),Math.round(f(4)*255)]}
function cc(st){return color==='rainbow'?'hsl('+(st.hue%360)+',90%,55%)':color}

/* ---------- shapes (unit coordinates -1..1) ---------- */
function polyP(pts){return function(c){c.moveTo(pts[0],pts[1]);for(var i=2;i<pts.length;i+=2)c.lineTo(pts[i],pts[i+1]);c.closePath()}}
function regP(n){return function(c){for(var i=0;i<n;i++){var a=-Math.PI/2+i*PI2/n;if(i)c.lineTo(Math.cos(a),Math.sin(a));else c.moveTo(Math.cos(a),Math.sin(a))}c.closePath()}}
function circP(c){c.arc(0,0,1,0,7)}
var SHAPES=[
 {id:'circle',n:'Κύκλος',a:1,p:circP},
 {id:'oval',n:'Οβάλ',a:.62,p:circP},
 {id:'square',n:'Τετράγωνο',a:1,p:function(c){c.rect(-1,-1,2,2)}},
 {id:'rect',n:'Ορθογώνιο',a:.6,p:function(c){c.rect(-1,-1,2,2)}},
 {id:'triangle',n:'Τρίγωνο',a:.9,p:polyP([0,-1,1,1,-1,1])},
 {id:'diamond',n:'Ρόμβος',a:1,p:polyP([0,-1,1,0,0,1,-1,0])},
 {id:'star',n:'Αστέρι',a:1,p:function(c){for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,r=i%2?.42:1;if(i)c.lineTo(Math.cos(a)*r,Math.sin(a)*r);else c.moveTo(Math.cos(a)*r,Math.sin(a)*r)}c.closePath()}},
 {id:'heart',n:'Καρδιά',a:.95,p:function(c){c.moveTo(0,.92);c.bezierCurveTo(-.2,.7,-1,.2,-1,-.35);c.bezierCurveTo(-1,-.85,-.45,-1,0,-.55);c.bezierCurveTo(.45,-1,1,-.85,1,-.35);c.bezierCurveTo(1,.2,.2,.7,0,.92);c.closePath()}},
 {id:'pentagon',n:'Πεντάγωνο',a:1,p:regP(5)},
 {id:'hexagon',n:'Εξάγωνο',a:.9,p:regP(6)},
 {id:'cross',n:'Σταυρός',a:1,p:polyP([-.35,-1,.35,-1,.35,-.35,1,-.35,1,.35,.35,.35,.35,1,-.35,1,-.35,.35,-1,.35,-1,-.35,-.35,-.35])},
 {id:'arrow',n:'Βέλος',a:.6,p:polyP([-1,-.3,.2,-.3,.2,-.75,1,0,.2,.75,.2,.3,-1,.3])},
 {id:'moon',n:'Φεγγάρι',a:1,p:function(c){c.arc(0,0,1,-Math.PI/2,Math.PI/2,true);c.bezierCurveTo(.55,.55,.55,-.55,0,-1);c.closePath()}},
 {id:'cloud',n:'Σύννεφο',a:.65,p:function(c){c.moveTo(-.6,.55);c.bezierCurveTo(-1.05,.55,-1.05,-.15,-.55,-.2);c.bezierCurveTo(-.6,-.8,.05,-.85,.2,-.4);c.bezierCurveTo(.5,-.7,1,-.45,.85,-.05);c.bezierCurveTo(1.15,.05,1.05,.55,.65,.55);c.closePath()}},
 {id:'bolt',n:'Αστραπή',a:1,p:polyP([.2,-1,-.6,.1,-.05,.1,-.3,1,.6,-.15,.05,-.15])},
 {id:'semi',n:'Ημικύκλιο',a:.55,p:function(c){c.ellipse(0,1,1,2,0,Math.PI,PI2);c.closePath()}}
];
var SHP={};SHAPES.forEach(function(s){SHP[s.id]=s});

/* ---------- stamps ---------- */
var CATS=[
 {n:'Ζώα',i:'🐶',s:'🐶 🐱 🐭 🐹 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐮 🐷 🐸 🐵 🐔 🐧 🐦 🦆 🦉 🐴 🦄 🐝 🦋 🐌 🐞 🐢 🐍 🐘 🦒 🦓 🐑 🐪 🐊 🐿️ 🦔 🐓 🐕 🐈 🐇'},
 {n:'Θάλασσα',i:'🐠',s:'🐠 🐟 🐡 🦀 🦑 🐙 🐚 🐳 🐋 🐬 🦈 ⚓ 🦞 ⛵ 🏖️ 🌊 🏝️ 🐢 🦐 🛶 🌴'},
 {n:'Φύση',i:'🌳',s:'🌳 🌲 🌴 🌵 🌷 🌹 🌻 🌼 🌸 🍀 🍁 🍄 🌾 🌿 ☘️ 🌈 ☁️ ⛅ ⚡ ❄️ ⛄ 🔥 💧 ⛰️ 🌋 🌙 ☀️ ⭐ 🌟'},
 {n:'Οχήματα',i:'🚗',s:'🚗 🚕 🚙 🚌 🚎 🚓 🚑 🚒 🚜 🚚 🚛 🏎️ 🚲 🛴 🏍️ ✈️ 🚁 🚀 🛸 🚂 🚆 🚢 ⛵ 🚤 🛶 🚦 ⛽ 🚏'},
 {n:'Διάστημα',i:'🚀',s:'🌍 🌎 🌕 🌙 ⭐ 🌟 ✨ ☀️ 🪐 ☄️ 🌠 🌌 🚀 🛸 👽 🛰️ 🔭 👾 🌑 💫'},
 {n:'Αντικείμενα',i:'⚽',s:'⚽ 🏀 🏈 🎾 🎈 🎁 🎨 🖍️ ✏️ 📚 🎸 🎺 🥁 🎹 🧸 🎒 👑 🎩 👓 ☂️ 👟 ⏰ 💡 🔑 🎧 📷 🧩 🎲 🏆 🔔 ✂️ 🎮'},
 {n:'Φαγητό',i:'🍎',s:'🍎 🍌 🍇 🍓 🍉 🍊 🍋 🍒 🍑 🍍 🥕 🌽 🍅 🥦 🍞 🧀 🍕 🍔 🍟 🍦 🍩 🍪 🍰 🍭 🍫 🥐 🍿 🥞'},
 {n:'Πόλη',i:'🏠',s:'🏠 🏡 🏢 🏫 🏥 🏰 ⛪ 🕌 🏭 🗼 🌉 ⛲ 🚦 🎪 🎡 🎢 🏟️ ⛺ 🌆 🏗️ 🗽'},
 {n:'Γιορτές',i:'🎄',s:'🎄 🎅 🎃 👻 🎆 🎉 🎊 🎁 🎂 ❤️ 💛 💙 💚 💜 🌟 🎈 🕯️ 🐣 🥚 🎀 ⛄ ❄️'}
];
CATS.forEach(function(c){c.s=c.s.split(' ')});

/* ---------- brushes ---------- */
var BRUSHES=[['round','Στρογγυλό'],['square','Τετράγωνο'],['star','Αστέρια'],['heart','Καρδιές'],['spray','Σπρέι'],['crayon','Κηρομπογιά'],['flower','Λουλούδια'],['bubble','Φυσαλίδες']];
var SPC={square:.2,star:1,heart:1.1,spray:.25,crayon:.2,flower:1.5,bubble:1.0};
function brushStamp(c,type,s,q,col,st){
 c.fillStyle=col;c.strokeStyle=col;
 if(type==='square'){c.fillRect(q.x-s/2,q.y-s/2,s,s)}
 else if(type==='star'){c.save();c.translate(q.x,q.y);st.ang=(st.ang||0)+.35;c.rotate(st.ang);c.beginPath();SHP.star.p(c);c.restore();
  c.save();c.translate(q.x,q.y);c.rotate(st.ang);c.scale(s*.9,s*.9);c.beginPath();SHP.star.p(c);c.restore();c.fill()}
 else if(type==='heart'){c.save();c.translate(q.x,q.y);c.scale(s*.55,s*.55);c.beginPath();SHP.heart.p(c);c.restore();c.fill()}
