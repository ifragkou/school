<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Διαβάζω γραφήματα</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Segoe UI",Arial,sans-serif;background:#dfe3ee;color:#222;display:flex;flex-direction:column;min-height:100vh}
#top{background:linear-gradient(90deg,#2f9e44,#1c7ed6);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#top h1{margin:0;font-size:22px;flex:1;min-width:200px}
#score{background:rgba(255,255,255,.22);border-radius:20px;padding:5px 14px;font-size:17px;font-weight:700;white-space:nowrap}
#reset{font-family:inherit;font-size:14px;border:0;border-radius:18px;padding:7px 14px;background:#fff;color:#1c7ed6;font-weight:700;cursor:pointer}
#reset:hover{background:#e7ecff}
main{flex:1;padding:14px 18px;max-width:1200px;width:100%;margin:0 auto}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.12);padding:16px 20px}
#head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
#num{background:#f76707;color:#fff;font-weight:700;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
#title{font-size:23px;font-weight:700;margin:0}
#intro{font-size:18px;line-height:1.4;margin:6px 0 14px;color:#333;flex:1}
#introRow{display:flex;gap:18px;align-items:center;margin-bottom:6px}
#art{flex:none;width:260px;margin-bottom:8px}
#art svg{width:100%;height:auto;display:block;border-radius:12px}
@media(max-width:640px){#introRow{flex-direction:column;align-items:stretch}#art{width:100%;max-width:260px;margin:0 auto 8px}}
#body{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:860px){#body{grid-template-columns:1fr}}
#chartBox{border:2px solid #dde3f3;border-radius:12px;padding:10px;background:#fbfcff}
#chartTitle{text-align:center;font-weight:700;font-size:17px;margin:2px 0 6px}
#legend{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;margin:4px 0 2px;font-size:16px}
#legend span{display:inline-flex;align-items:center;gap:7px}
#legend i{display:inline-block;width:18px;height:18px;border-radius:4px}
svg{width:100%;height:auto;display:block}
svg text{font-family:"Segoe UI",Arial,sans-serif}
.q{border:2px solid #dde3f3;border-radius:12px;padding:10px 14px;margin-bottom:12px}
.q.done{background:#f8faff}
.qt{font-size:18px;font-weight:700;margin:0 0 8px;line-height:1.3}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:8px;font-family:inherit;font-size:17px;text-align:left;padding:8px 10px;border:2px solid #b9c2dd;background:#fff;border-radius:10px;cursor:pointer;color:#222}
.opt:hover:not(:disabled){background:#e7ecff;border-color:#4c6ef5}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;background:#e7ecff;color:#364fc7;display:flex;align-items:center;justify-content:center;font-size:15px}
.opt:disabled{cursor:default}
.opt.right{background:#d3f9d8;border-color:#2f9e44}
.opt.right b{background:#2f9e44;color:#fff}
.opt.wrong{background:#ffe3e3;border-color:#e03131}
.opt.wrong b{background:#e03131;color:#fff}
.fb{margin:8px 0 0;font-size:16px;line-height:1.35}
.fb.ok{color:#2b8a3e}.fb.no{color:#c92a2a}
#nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;flex-wrap:wrap}
.nb{font-family:inherit;font-size:18px;font-weight:700;border:0;border-radius:12px;padding:11px 22px;background:#1c7ed6;color:#fff;cursor:pointer}
.nb:hover:not(:disabled){background:#1864ab}
.nb:disabled{background:#adb5bd;cursor:default}
#dots{display:flex;gap:10px}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid #1c7ed6;background:#fff;cursor:pointer;padding:0}
.dot.cur{background:#1c7ed6}
.dot.fin{border-color:#2f9e44}
.dot.fin.cur{background:#2f9e44}
#final{display:none;text-align:center;font-size:20px;font-weight:700;color:#2b8a3e;margin:10px 0 0}
.fsbtn{width:34px;height:32px;padding:0;border:1px solid rgba(255,255,255,.65);border-radius:7px;background:rgba(255,255,255,.18);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.fsbtn:hover{background:rgba(255,255,255,.38)}
.fsbtn:focus-visible{outline:3px solid #ffd43b;outline-offset:1px}
.fsbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.fsbtn .ico-exit{display:none}
.is-fs .fsbtn .ico-enter{display:none}
.is-fs .fsbtn .ico-exit{display:block}
</style>
</head>
<body>
<div id="top">
  <h1>📊 Διαβάζω γραφήματα</h1>
  <div id="score">Σωστές: 0 / 24</div>
  <button id="reset" type="button">↺ Από την αρχή</button>
  <button class="fsbtn" id="fsBtn" type="button" aria-label="Πλήρης οθόνη" title="Πλήρης οθόνη">
    <svg class="ico-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6"/></svg>
    <svg class="ico-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v6H3M21 9h-6V3M15 21v-6h6M3 15h6v6"/></svg>
  </button>
</div>
<main>
  <div class="card">
    <div id="head"><div id="num">1</div><h2 id="title"></h2></div>
    <div id="introRow"><p id="intro"></p><div id="art"></div></div>
    <div id="body">
      <div id="chartBox">
        <div id="chartTitle"></div>
        <div id="legend"></div>
        <div id="chart"></div>
      </div>
      <div id="questions"></div>
    </div>
    <div id="final"></div>
  </div>
  <div id="nav" style="margin-top:14px">
    <button class="nb" id="prev" type="button">◀ Προηγούμενο</button>
    <div id="dots"></div>
    <button class="nb" id="next" type="button">Επόμενο ▶</button>
  </div>
</main>

var cur = 0;
var ans = S.map(function(s){ return s.qs.map(function(){ return null; }); });
var TOTAL = S.reduce(function(n,s){ return n + s.qs.length; }, 0);

function fmt(v, d){ return (d ? Number(v).toFixed(d) : String(v)).replace('.', ','); }
function el(id){ return document.getElementById(id); }
function ns(tag, attrs, text){
  var e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}

function barChart(c){
  var W = 640, H = 400, L = 60, R = 14, T = 26, B = 44;
  var dec = c.step < 1 ? 1 : 0;
  var pw = W - L - R, ph = H - T - B;
  var svg = ns('svg', {viewBox:'0 0 '+W+' '+H, role:'img', 'aria-label':c.title});
  var mn = c.min || 0;
  var y = function(v){ return T + ph - ((v - mn) / (c.max - mn)) * ph; };
  for (var v = mn; v <= c.max + 1e-9; v += c.step){
    var yy = y(v);
    svg.appendChild(ns('line', {x1:L, x2:W-R, y1:yy, y2:yy, stroke: v === mn ? '#444' : '#d5dbea', 'stroke-width': v === mn ? 2 : 1}));
    svg.appendChild(ns('text', {x:L-8, y:yy+5, 'text-anchor':'end', 'font-size':15, fill:'#444'}, fmt(Math.round(v*100)/100, dec)));
  }
  svg.appendChild(ns('line', {x1:L, x2:L, y1:T, y2:T+ph, stroke:'#444', 'stroke-width':2}));
  var yl = ns('text', {x:16, y:T+ph/2, 'text-anchor':'middle', 'font-size':15, fill:'#555', transform:'rotate(-90 16 '+(T+ph/2)+')'}, c.yLabel);
  svg.appendChild(yl);
  var n = c.cats.length, k = c.series.length, gw = pw / n, gap = 4;
  var bw = Math.min(56, gw * 0.8 / k - gap);
  c.cats.forEach(function(cat, gi){
    var total = k * bw + (k - 1) * gap;
    var x0 = L + gi * gw + (gw - total) / 2;
    c.series.forEach(function(s, si){
      var val = s.values[gi], x = x0 + si * (bw + gap), top = y(val);
      svg.appendChild(ns('rect', {x:x, y:top, width:bw, height:T+ph-top, fill:(c.colors||COLORS)[si], rx:3}));
      svg.appendChild(ns('text', {x:x+bw/2, y:top-6, 'text-anchor':'middle', 'font-size':16, 'font-weight':700, fill:'#222'}, fmt(val, dec)));
    });
    svg.appendChild(ns('text', {x:L+gi*gw+gw/2, y:H-14, 'text-anchor':'middle', 'font-size':17, 'font-weight':700, fill:'#222'}, cat));
  });
  return svg;
}

function pieChart(c){
  var size = 360, cx = 180, cy = 180, r = 160;
  var svg = ns('svg', {viewBox:'0 0 '+size+' '+size, role:'img', 'aria-label':c.title});
  svg.style.maxWidth = '420px'; svg.style.margin = '0 auto';
  var total = c.items.reduce(function(a,b){ return a + b[1]; }, 0);
  var ang = -Math.PI / 2;
  c.items.forEach(function(it, i){
    var a2 = ang + (it[1] / total) * 2 * Math.PI;
    var x1 = cx + r*Math.cos(ang), y1 = cy + r*Math.sin(ang);
    var x2 = cx + r*Math.cos(a2),  y2 = cy + r*Math.sin(a2);
    var large = (a2 - ang) > Math.PI ? 1 : 0;
    svg.appendChild(ns('path', {d:'M'+cx+' '+cy+' L'+x1+' '+y1+' A'+r+' '+r+' 0 '+large+' 1 '+x2+' '+y2+' Z', fill:COLORS[i], stroke:'#fff', 'stroke-width':4, 'stroke-linejoin':'round'}));
    var mid = (ang + a2) / 2;
    svg.appendChild(ns('text', {x:cx + r*0.62*Math.cos(mid), y:cy + r*0.62*Math.sin(mid) + 9, 'text-anchor':'middle', 'font-size':28, 'font-weight':700, fill:'#fff', stroke:'rgba(0,0,0,.35)', 'stroke-width':0.8, 'paint-order':'stroke'}, it[1]));
    ang = a2;
  });
  return svg;
}

function renderChart(){
  var c = S[cur].chart;
  el('chartTitle').textContent = c.title;
  var lg = el('legend'); lg.innerHTML = '';
  var names = c.type === 'bars'
    ? (c.series.length > 1 ? c.series.map(function(s){ return s.name; }) : [])
    : c.items.map(function(i){ return i[0]; });
  names.forEach(function(nm, i){
    var sp = document.createElement('span');
    var sw = document.createElement('i'); sw.style.background = (c.colors||COLORS)[i];
    sp.appendChild(sw); sp.appendChild(document.createTextNode(nm));
    lg.appendChild(sp);
  });
  var box = el('chart'); box.innerHTML = '';
  box.appendChild(c.type === 'bars' ? barChart(c) : pieChart(c));
}

function renderQs(){
  var box = el('questions'); box.innerHTML = '';
  S[cur].qs.forEach(function(q, qi){
    var d = document.createElement('div'); d.className = 'q';
    var p = document.createElement('p'); p.className = 'qt'; p.textContent = (qi+1) + '. ' + q.q; d.appendChild(p);
    var og = document.createElement('div'); og.className = 'opts'; d.appendChild(og);
    var chosen = ans[cur][qi];
    q.o.forEach(function(txt, oi){
      var b = document.createElement('button'); b.type = 'button'; b.className = 'opt';
      b.innerHTML = '<b>' + LETTERS[oi] + '</b><span></span>';
      b.lastChild.textContent = txt;
      if (chosen !== null){
        b.disabled = true;
        if (oi === q.a) b.classList.add('right');
        else if (oi === chosen) b.classList.add('wrong');
      } else {
        b.onclick = function(){ ans[cur][qi] = oi; refresh(); };
      }
      og.appendChild(b);
    });
    if (chosen !== null){
      d.classList.add('done');
      var f = document.createElement('p');
      var ok = chosen === q.a;
      f.className = 'fb ' + (ok ? 'ok' : 'no');
      f.textContent = (ok ? '✔ Μπράβο! ' : '✘ Όχι ακριβώς. Η σωστή απάντηση είναι η ' + LETTERS[q.a] + '. ') + q.why;
      d.appendChild(f);
    }
    box.appendChild(d);
  });
}

function scoreOf(i){
  return S[i].qs.reduce(function(n, q, qi){ return n + (ans[i][qi] === q.a ? 1 : 0); }, 0);
}
function doneOf(i){ return ans[i].every(function(a){ return a !== null; }); }

function renderChrome(){
  el('num').textContent = cur + 1;
  el('title').textContent = S[cur].title;
  el('intro').textContent = S[cur].intro;
  el('art').innerHTML = ART[S[cur].art] || '';
  var tot = 0, all = true;
  for (var i = 0; i < S.length; i++){ tot += scoreOf(i); if (!doneOf(i)) all = false; }
  el('score').textContent = 'Σωστές: ' + tot + ' / ' + TOTAL;
  var dots = el('dots'); dots.innerHTML = '';
  S.forEach(function(s, i){
    var b = document.createElement('button'); b.type = 'button';
    b.className = 'dot' + (i === cur ? ' cur' : '') + (doneOf(i) ? ' fin' : '');
    b.setAttribute('aria-label', 'Γράφημα ' + (i+1));
    b.onclick = function(){ go(i); };
    dots.appendChild(b);
  });
  el('prev').disabled = cur === 0;
  el('next').disabled = cur === S.length - 1;
  var fin = el('final');
  if (all){
    fin.style.display = 'block';
    fin.textContent = '🎉 Τέλος! Απάντησες σωστά σε ' + tot + ' από τις ' + TOTAL + ' ερωτήσεις.';
  } else if (doneOf(cur)){
    fin.style.display = 'block';
    fin.textContent = 'Σωστές σε αυτό το γράφημα: ' + scoreOf(cur) + ' / ' + S[cur].qs.length + '. Πάτησε «Επόμενο» για να συνεχίσεις.';
  } else {
    fin.style.display = 'none';
  }
}

function refresh(){ renderChrome(); renderQs(); }
function go(i){
  cur = i; renderChart(); refresh(); window.scrollTo(0, 0);
}
el('prev').onclick = function(){ if (cur > 0) go(cur - 1); };
el('next').onclick = function(){ if (cur < S.length - 1) go(cur + 1); };
el('reset').onclick = function(){
  ans = S.map(function(s){ return s.qs.map(function(){ return null; }); });
  go(0);
};
document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowLeft' && cur > 0) go(cur - 1);
  if (e.key === 'ArrowRight' && cur < S.length - 1) go(cur + 1);
});
/* πλήρης οθόνη */
(function(){
  var fsBtn=document.getElementById('fsBtn'),rootEl=document.documentElement;
  function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement;}
  fsBtn.addEventListener('click',function(){
    try{
      if(fsEl()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
      else{(rootEl.requestFullscreen||rootEl.webkitRequestFullscreen).call(rootEl);}
    }catch(e){}
  });
  function fsUpd(){
    var on=!!fsEl();
    rootEl.classList.toggle('is-fs',on);
    fsBtn.setAttribute('aria-label',on?'Έξοδος από πλήρη οθόνη':'Πλήρης οθόνη');
    fsBtn.title=on?'Έξοδος από πλήρη οθόνη':'Πλήρης οθόνη';
  }
  document.addEventListener('fullscreenchange',fsUpd);
  document.addEventListener('webkitfullscreenchange',fsUpd);
})();
go(0);
</script>
