<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Γράφω τη λέξη</title>
<style>
  :root{
    --bg:#fff7e6; --ink:#2d3a4a; --blue:#3b82f6; --green:#22a559; --red:#e5484d;
    --card:#ffffff; --line:#e3d9c4;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh;
  }
  header{text-align:center; padding:14px 10px 4px}
  header h1{margin:0; font-size:clamp(22px,4vw,34px); color:#d9480f}
  header p{margin:4px 0 0; font-size:clamp(14px,2vw,18px)}
  .app{max-width:1000px; margin:0 auto; padding:8px 12px 24px}
  .stage{display:flex; align-items:stretch; gap:8px}
  .nav{
    flex:0 0 auto; align-self:center; width:52px; height:52px; border-radius:50%;
    border:none; background:var(--blue); color:#fff; font-size:28px; cursor:pointer;
    box-shadow:0 3px 0 #1d4ed8;
  }
  .nav:disabled{background:#b6c2d6; box-shadow:0 3px 0 #94a3b8; cursor:default}
  .viewport{flex:1; overflow:hidden; border-radius:22px}
  .track{display:flex; transition:transform .45s ease}
  .slide{flex:0 0 100%; padding:4px}
  .card{
    background:var(--card); border:3px solid var(--line); border-radius:22px; padding:14px;
  }
  .card h2{
    margin:0 0 10px; text-align:center; font-size:clamp(20px,3vw,28px);
    color:#fff; background:var(--theme); border-radius:14px; padding:8px;
  }
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
  .box{
    border:3px solid var(--line); border-radius:18px; padding:8px; background:#fffdf8;
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .pic{width:100%; aspect-ratio:1/1; max-height:170px; border-radius:14px; overflow:hidden; background:var(--pbg)}
  .pic svg{width:100%; height:100%; display:block}
  .word{font-size:clamp(16px,2.6vw,26px); font-weight:800; letter-spacing:2px; color:#334155; text-align:center}
  .box input{
    width:100%; font:inherit; font-size:clamp(16px,2.6vw,26px); font-weight:800; letter-spacing:2px;
    text-align:center; text-transform:uppercase; padding:8px 4px; border:3px solid #cbd5e1;
    border-radius:12px; background:#fff; color:#1e293b; outline:none;
  }
  .box input:focus{border-color:var(--blue)}
  .box.ok{border-color:var(--green); background:#e8f8ee}
  .box.ok input{border-color:var(--green); background:#c9f0d8; color:#0f6b36}
  .box.bad{border-color:var(--red); background:#fdecec}
  .box.bad input{border-color:var(--red); background:#fbd0d2; color:#a3171c}
  .actions{display:flex; align-items:center; justify-content:center; gap:14px; margin-top:12px; flex-wrap:wrap}
  .check{
    font:inherit; font-size:clamp(16px,2.4vw,22px); font-weight:800; color:#fff; background:var(--green);
    border:none; border-radius:16px; padding:10px 22px; cursor:pointer; box-shadow:0 4px 0 #157a40;
  }
  .check:active{transform:translateY(2px); box-shadow:0 2px 0 #157a40}
  .msg{font-size:clamp(16px,2.4vw,22px); font-weight:700; min-height:1.4em}
  .dots{display:flex; justify-content:center; gap:10px; margin-top:12px}
  .dot{width:16px; height:16px; border-radius:50%; background:#d6cdb8; border:none; cursor:pointer; padding:0}
  .dot.on{background:#d9480f; transform:scale(1.25)}
  @media (max-width:620px){
    .grid{grid-template-columns:repeat(2,1fr)}
    .nav{width:42px; height:42px; font-size:22px}
  }
</style>
</head>
<body>
<header>
  <h1>✏️ Γράφω τη λέξη</h1>
  <p>Κοίτα την εικόνα, διάβασε τη λέξη και γράψε την με κεφαλαία γράμματα στο κουτάκι.</p>
</header>

<div class="app">
  <div class="stage">
    <button class="nav" id="prev" aria-label="Προηγούμενη κάρτα">◀</button>
    <div class="viewport"><div class="track" id="track"></div></div>
    <button class="nav" id="next" aria-label="Επόμενη κάρτα">▶</button>
  </div>
  <div class="dots" id="dots"></div>
</div>

/* ---------- Βοηθητικά ---------- */
function clean(s){
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/ς/g,'Σ').replace(/\s+/g,'');
}

/* ---------- Δημιουργία καρτών ---------- */
var track = document.getElementById('track');
var dotsEl = document.getElementById('dots');
var current = 0;

CARDS.forEach(function(card, ci){
  var slide = document.createElement('div');
  slide.className = 'slide';
  var html = '<div class="card" style="--theme:'+card.color+'"><h2>Κάρτα '+(ci+1)+': '+card.title+'</h2><div class="grid">';
  card.items.forEach(function(it, ii){
    html += '<div class="box" data-word="'+it.w+'">' +
      '<div class="pic" style="--pbg:'+card.pbg+'">'+it.svg+'</div>' +
      '<div class="word">'+it.w+'</div>' +
      '<input type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Γράψε τη λέξη '+it.w+'">' +
      '</div>';
  });
  html += '</div><div class="actions"><button class="check">✔ Έλεγχος λαθών</button><span class="msg"></span></div></div>';
  slide.innerHTML = html;
  track.appendChild(slide);

  var boxes = slide.querySelectorAll('.box');
  var msg = slide.querySelector('.msg');

  boxes.forEach(function(box){
    var inp = box.querySelector('input');
    inp.addEventListener('input', function(){
      var c = clean(inp.value);
      var shown = inp.value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/ς/g,'Σ');
      if(shown !== inp.value){ inp.value = shown; }
      box.classList.remove('ok','bad');
      msg.textContent = '';
    });
  });

  slide.querySelector('.check').addEventListener('click', function(){
    var good = 0;
    boxes.forEach(function(box){
      var inp = box.querySelector('input');
      var ok = clean(inp.value) === box.getAttribute('data-word');
      box.classList.remove('ok','bad');
      box.classList.add(ok ? 'ok' : 'bad');
      if(ok) good++;
    });
    if(good === boxes.length){
      msg.style.color = '#157a40';
      msg.textContent = '🌟 Μπράβο! Όλες οι λέξεις είναι σωστές!';
    } else {
      msg.style.color = '#a3171c';
      msg.textContent = 'Σωστές: ' + good + ' από ' + boxes.length + '. Διόρθωσε τις κόκκινες!';
    }
  });

  var d = document.createElement('button');
  d.className = 'dot';
  d.setAttribute('aria-label', 'Κάρτα ' + (ci+1));
  d.addEventListener('click', function(){ go(ci); });
  dotsEl.appendChild(d);
});

/* ---------- Καρουζέλ ---------- */
var prev = document.getElementById('prev');
var next = document.getElementById('next');
function go(n){
  current = Math.max(0, Math.min(CARDS.length-1, n));
  track.style.transform = 'translateX(' + (-100*current) + '%)';
  prev.disabled = current === 0;
  next.disabled = current === CARDS.length-1;
  var ds = dotsEl.children;
  for(var i=0;i<ds.length;i++){ ds[i].classList.toggle('on', i===current); }
}
prev.addEventListener('click', function(){ go(current-1); });
next.addEventListener('click', function(){ go(current+1); });
go(0);
</script>
