<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Κυνήγι θησαυρού στο Excel</title>
<style>
*{box-sizing:border-box}
html{height:100%;overflow:hidden;overscroll-behavior:none}
body{height:100%;overflow:hidden;margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#eef3ef;color:#222;-webkit-user-select:none;user-select:none}
#app{position:absolute;left:0;top:0;width:920px;transform-origin:0 0}
.top{background:#217346;color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:21px;margin:0;flex:1;min-width:240px}
.top label{font-size:14px}
.top select,.top button{font-size:15px;padding:6px 10px;border-radius:6px;border:0;font-family:inherit}
.top button{background:#ffd93b;font-weight:700;cursor:pointer}
.car{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.15);padding:4px 8px;border-radius:12px}
.top .car button{width:34px;height:34px;font-size:26px;line-height:1;padding:0;background:#fff;border-radius:50%;cursor:pointer;font-weight:700;color:#217346}
.cinfo{min-width:130px}
#ctitle{font-size:14px;font-weight:700;text-align:center}
#dots{display:flex;gap:6px;justify-content:center;margin-top:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.4);cursor:pointer}
.dot.on{background:#ffd93b}
.top button.fsbtn{background:transparent;width:40px;height:40px;padding:6px;border:2px solid rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;cursor:pointer}
.top button.fsbtn:hover{background:rgba(255,255,255,.2)}
.fbar{display:flex;align-items:center;background:#fff;border-bottom:1px solid #bbb;min-height:36px}
#namebox{width:90px;text-align:center;border-right:1px solid #ccc;font-weight:700;line-height:36px;font-size:16px}
.fx{padding:0 12px;font-style:italic;color:#217346;font-weight:700;border-right:1px solid #ccc;line-height:36px}
#msg{padding:4px 14px;font-size:16px;font-weight:600;flex:1;color:#333}
#msg.ok{color:#14702f}
#msg.err{color:#c0262d}
.main{display:flex;flex-wrap:nowrap;gap:16px;padding:16px;align-items:flex-start;justify-content:center}
#sheet{position:relative;display:grid;grid-template-columns:36px repeat(10,52px);grid-template-rows:24px repeat(8,44px);background:#fff;border:1px solid #aaa;width:max-content}
.hd{background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;box-shadow:inset -1px -1px 0 #c8c8c8}
.hd.hl{background:#ffd93b;color:#7a4b00;animation:pulse .8s infinite alternate}
@keyframes pulse{from{box-shadow:inset 0 0 0 2px #ff9800}to{box-shadow:inset 0 0 0 2px transparent}}
.cell{position:relative;box-shadow:inset -1px -1px 0 rgba(0,0,0,.12);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:24px;line-height:1}
.t-sea{background:#bfe6f7} .t-sand{background:#f5e6ae} .t-grass{background:#c5e6a6} .t-rock{background:#cfc8bf}
.cell:hover{filter:brightness(.93)}
.cell.here{outline:3px solid #ff5722;outline-offset:-3px;z-index:2}
.cell.found{background:#fff3a6;cursor:default;font-size:30px;animation:pop .35s}
.cell.wrong{animation:shake .35s;outline:3px solid #d32f2f;outline-offset:-3px;z-index:3}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#counter{margin-top:8px;font-size:16px;font-weight:700}
#panel{flex:1;min-width:0;background:#fbf0cf;border:2px solid #b98a2f;border-radius:12px;padding:12px 16px;background-image:repeating-linear-gradient(0deg,rgba(150,100,20,.05) 0 2px,transparent 2px 6px)}
#panel h2{margin:0;font-size:19px;color:#6b4412}
#mapname{font-size:14px;color:#8a6a2f;margin:2px 0 10px;font-weight:600}
#step{font-size:14px;font-weight:700;color:#8a6a2f}
#clue{font-size:19px;line-height:1.4;font-weight:600;margin:4px 0 12px;color:#2b1d08}
#clue b{background:#ffe27a;border-radius:4px;padding:0 4px}
#inv{display:flex;flex-wrap:wrap;gap:6px}
.slot{width:44px;height:44px;border:2px dashed #b98a2f;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;background:#fff9e6;color:#c9b27a}
.slot.on{border-style:solid;border-color:#2e9b4f;background:#e4f7e8;color:#000}
#win{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;align-items:center;justify-content:center}
#win .box{background:#fff;border-radius:16px;padding:28px 40px;text-align:center;max-width:90vw}
#win h2{font-size:34px;margin:0 0 8px;color:#217346}
#win p{font-size:18px;margin:0 0 16px}
#win button{font-size:17px;padding:8px 18px;border-radius:8px;border:0;background:#217346;color:#fff;font-weight:700;cursor:pointer;margin:0 6px;font-family:inherit}
#win button.sec{background:#ddd;color:#222}
body::after{content:'';position:fixed;inset:0;border:2px solid #bdbdbd;pointer-events:none;z-index:3000}
</style>
</head>
<body>
<div id="app">
<div class="top">
  <h1>🏴‍☠️ Κυνήγι θησαυρού στο Excel</h1>
  <div class="car">
    <button id="prev" title="Προηγούμενος χάρτης">‹</button>
    <div class="cinfo"><div id="ctitle"></div><div id="dots"></div></div>
    <button id="next" title="Επόμενος χάρτης">›</button>
  </div>
  <button id="again">Ξανά</button>
  <button id="fs" class="fsbtn" aria-label="Πλήρης οθόνη"></button>
</div>
<div class="fbar">
  <div id="namebox">—</div>
  <div class="fx">fx</div>
  <div id="msg"></div>
</div>
<div class="main">
  <div>
    <div id="sheet"></div>
    <div id="counter"></div>
  </div>
  <div id="panel">
    <h2>📜 Ο οδηγός του πειρατή</h2>
    <div id="mapname"></div>
    <div id="step"></div>
    <div id="clue"></div>
    <div id="inv"></div>
  </div>
</div>
</div>
<div id="win">
  <div class="box">
    <h2>🏆 Βρήκες τον θησαυρό!</h2>
    <p>Μπράβο, εξερευνητή των κελιών!</p>
    <button id="winNext">Επόμενος χάρτης</button>
    <button id="winClose" class="sec">Κλείσιμο</button>
  </div>
</div>
<script>
(function(){
const COLS=10, ROWS=8;
const L=function(i){return String.fromCharCode(65+i)};
function el(t,c,x){const d=document.createElement(t);if(c)d.className=c;if(x!==undefined)d.textContent=x;return d}
function addr(a){return [a.charCodeAt(0)-65,parseInt(a.slice(1),10)-1]}
function rng(s){
  const p=s.split(':');if(p.length===1)return [s];
  const a=addr(p[0]),b=addr(p[1]),o=[];
  for(let r=a[1];r<=b[1];r++)for(let c=a[0];c<=b[0];c++)o.push(L(c)+(r+1));
  return o;
}
const TERR={'~':['t-sea',''],s:['t-sand',''],g:['t-grass',''],P:['t-grass','🌴'],R:['t-rock','🪨'],M:['t-rock','⛰️']};

const MAPS=[
 {name:'Το νησί των φοινίκων',start:'A1',
  rows:['~~~~~~~~~~','~~ssssss~~','~sgPggPgs~','~sgggRggs~','~sPggggPs~','~sggRgggs~','~~ssssss~~','~~~~~~~~~~'],
  steps:[
   {to:'C3',e:'🦜',n:'Παπαγάλος',clue:'Το πλοίο σου είναι στο κελί <b>A1</b>. Ο παπαγάλος σου δείχνει το πρώτο μέρος: πήγαινε στο κελί <b>C3</b>.'},
   {to:'H3',e:'🧭',n:'Πυξίδα',clue:'Ο παπαγάλος λέει: «Η πυξίδα είναι στο κελί <b>H3</b>!»'},
   {to:'F5',e:'🗝️',n:'Κλειδί',clue:'Η πυξίδα δείχνει προς το κελί <b>F5</b>, όπου είναι κρυμμένο ένα κλειδί.'},
   {to:'D6',e:'💰',n:'Θησαυρός',clue:'Το κλειδί ταιριάζει σε ένα σεντούκι στο κελί <b>D6</b>!'}
  ]},
 {name:'Το μυστικό σπήλαιο',start:'B2',
  rows:['~~~~~~~~~~','~sggggss~~','~gMggggMs~','~sgggMggs~','~gggMgggs~','~sgggggMs~','~~sgggss~~','~~~~~~~~~~'],
  steps:[
   {to:'E4',e:'🗺️',n:'Παλιός χάρτης',clue:'Το πλοίο σου είναι στο κελί <b>B2</b>. Ο παλιός χάρτης είναι κρυμμένος στο κελί <b>E4</b>.'},
   {to:'H4',e:'🧭',n:'Πυξίδα',clue:'Ο χάρτης δείχνει μια πυξίδα στο κελί <b>H4</b>.'},
   {to:'H6',e:'🔦',n:'Φακός',clue:'Η πυξίδα οδηγεί σε μια σπηλιά. Πήγαινε στο κελί <b>H6</b> για να βρεις έναν φακό.'},
   {to:'D6',e:'🗝️',n:'Κλειδί',clue:'Με τον φακό φωτίζεις το σκοτάδι και βλέπεις ένα κλειδί στο κελί <b>D6</b>.'},
   {to:'D4',e:'💰',n:'Θησαυρός',clue:'Το κλειδί ανοίγει το σεντούκι που είναι στο κελί <b>D4</b>!'}
  ]},
 {name:'Ο θησαυρός του πειρατή',start:'J8',
  rows:['~~~~~~~~~~','~sggPggss~','~gPggggPs~','~gggRgggs~','~sgggPgss~','~gPgggggs~','~sggRgPgs~','~~ssssss~~'],
  steps:[
   {to:'C2',e:'🧩',n:'Κομμάτι χάρτη',clue:'Το πλοίο σου είναι στο κελί <b>J8</b>. Πήγαινε στο κελί <b>C2</b> για να βρεις ένα κομμάτι του χάρτη 🧩.'},
   {to:'F4',e:'🧭',n:'Πυξίδα',clue:'Το κομμάτι του χάρτη δείχνει μια πυξίδα στο κελί <b>F4</b>.'},
   {to:'I4',e:'⚓',n:'Άγκυρα',clue:'Η πυξίδα οδηγεί σε μια παλιά άγκυρα στο κελί <b>I4</b>.'},
   {to:'B5',e:'🦜',n:'Παπαγάλος',clue:'Ο παπαγάλος σε φωνάζει από μακριά! Πήγαινε στο κελί <b>B5</b>.'},
   {to:'E5',e:'🔦',n:'Φακός',clue:'Ο παπαγάλος σου δείχνει έναν φακό στο κελί <b>E5</b>.'},
   {to:'H7',e:'🗝️',n:'Κλειδί',clue:'Με τον φακό βλέπεις ένα κλειδί στο κελί <b>H7</b>.'},
   {to:'B7',e:'💰',n:'Θησαυρός',clue:'Το κλειδί ανοίγει το σεντούκι του πειρατή στο κελί <b>B7</b>!'}
  ]}
];
MAPS.forEach(function(m){if(m.rows.length!==ROWS||m.rows.some(function(r){return r.length!==COLS}))console.error('bad map',m.name)});

const sheet=document.getElementById('sheet'),msg=document.getElementById('msg'),namebox=document.getElementById('namebox');
const counter=document.getElementById('counter'),winEl=document.getElementById('win');
let idx=0,step=0,wrong=0,found={},hereKey='',cells={},colH=[],rowH=[],targets=[];

function say(t,c){msg.textContent=t||'';msg.className=c||''}
function build(){
  const M=MAPS[idx];sheet.innerHTML='';cells={};colH=[];rowH=[];
  sheet.appendChild(el('div','hd'));
  for(let c=0;c<COLS;c++){const h=el('div','hd',L(c));colH.push(h);sheet.appendChild(h)}
  for(let r=0;r<ROWS;r++){
    const h=el('div','hd',String(r+1));rowH.push(h);sheet.appendChild(h);
    for(let c=0;c<COLS;c++){
      const t=TERR[M.rows[r][c]],k=L(c)+(r+1);
      const d=el('div','cell '+t[0],t[1]);d.dataset.a=k;
      d.addEventListener('click',function(){onCell(k)});
      cells[k]=d;sheet.appendChild(d);
    }
  }
  cells[M.start].textContent='⛵';
}
function renderCar(){
  document.getElementById('ctitle').textContent='Χάρτης '+(idx+1)+' από '+MAPS.length;
  const dots=document.getElementById('dots');dots.innerHTML='';
  MAPS.forEach(function(_,i){const d=el('span','dot'+(i===idx?' on':''));d.addEventListener('click',function(){go(i)});dots.appendChild(d)});
}
function setHere(k){
  if(hereKey&&cells[hereKey])cells[hereKey].classList.remove('here');
  hereKey=k;cells[k].classList.add('here');
}
function clearHl(){colH.concat(rowH).forEach(function(h){h.classList.remove('hl')})}
function showStep(){
  const M=MAPS[idx],S=M.steps[step];
  document.getElementById('mapname').textContent=M.name;
  document.getElementById('step').textContent='Βήμα '+(step+1)+' από '+M.steps.length;
  document.getElementById('clue').innerHTML=S.clue;
  targets=rng(S.to).filter(function(k){return !found[k]});
  counter.textContent='Αντικείμενα που βρήκες: '+step+' από '+M.steps.length;
  const inv=document.getElementById('inv');inv.innerHTML='';
  M.steps.forEach(function(s,i){const d=el('div','slot'+(i<step?' on':''),i<step?s.e:'?');d.title=i<step?s.n:'';inv.appendChild(d)});
  wrong=0;clearHl();
}
function onCell(k){
  const M=MAPS[idx],S=M.steps[step];
  if(!S)return;
  const c=addr(k);
  namebox.textContent=k;
  if(found[k]){say('Αυτό το κελί το έχεις ήδη βρει: '+found[k].n,'ok');return}
  if(targets.indexOf(k)>=0){
    found[k]={e:S.e,n:S.n};
    const d=cells[k];d.textContent=S.e;d.classList.add('found');
    targets.splice(targets.indexOf(k),1);
    setHere(k);
    if(targets.length){say('Σωστά! '+S.n+' στο '+k+'. Ψάξε και τα υπόλοιπα κελιά της περιοχής ('+targets.length+' ακόμα).','ok')}
    else{
      step++;
      if(step>=M.steps.length){
        say('Βρήκες τον θησαυρό! 🎉','ok');
        counter.textContent='Αντικείμενα που βρήκες: '+step+' από '+M.steps.length;
        document.getElementById('step').textContent='Η αποστολή ολοκληρώθηκε!';
        document.getElementById('clue').innerHTML='Μπράβο! Βρήκες όλα τα αντικείμενα και τον θησαυρό.';
        const inv=document.getElementById('inv');inv.innerHTML='';
        M.steps.forEach(function(s){const d=el('div','slot on',s.e);d.title=s.n;inv.appendChild(d)});
        clearHl();
        setTimeout(function(){winEl.style.display='flex'},700);
      }else{say('Σωστά! Βρήκες: '+S.n+' '+S.e,'ok');showStep()}
    }
  }else{
    const d=cells[k];d.classList.remove('wrong');void d.offsetWidth;d.classList.add('wrong');
    setTimeout(function(){d.classList.remove('wrong')},900);
    wrong++;
    say('Στο κελί '+k+' δεν υπάρχει τίποτα. Διάβασε ξανά τον οδηγό!','err');
    if(wrong>=3&&targets.length){
      const t=addr(targets[0]);clearHl();colH[t[0]].classList.add('hl');rowH[t[1]].classList.add('hl');
    }
  }
}
function go(i){
  idx=(i+MAPS.length)%MAPS.length;step=0;found={};hereKey='';
  winEl.style.display='none';
  build();renderCar();setHere(MAPS[idx].start);showStep();say('');namebox.textContent='—';
}
document.getElementById('prev').addEventListener('click',function(){go(idx-1)});
document.getElementById('next').addEventListener('click',function(){go(idx+1)});
document.getElementById('again').addEventListener('click',function(){go(idx)});
document.getElementById('winNext').addEventListener('click',function(){go(idx+1)});
document.getElementById('winClose').addEventListener('click',function(){winEl.style.display='none'});
go(0);
})();
</script>
<script>
(function(){
  var b=document.getElementById('fs');
  var expand='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
  var compress='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
  function isFs(){return document.fullscreenElement||document.webkitFullscreenElement}
  function upd(){b.innerHTML=isFs()?compress:expand}
  b.addEventListener('click',function(){
    var d=document,e=d.documentElement,r;
    try{
      if(isFs()){r=(d.exitFullscreen||d.webkitExitFullscreen).call(d)}
      else{r=(e.requestFullscreen||e.webkitRequestFullscreen).call(e)}
      if(r&&r.catch)r.catch(function(){});
    }catch(err){}
  });
  document.addEventListener('fullscreenchange',upd);
  document.addEventListener('webkitfullscreenchange',upd);
  upd();
})();
</script>
<script>
(function(){
  var app=document.getElementById('app'),maxH=[0,0],raf=0;
  var topBar=app.querySelector('.top'),fbar=app.querySelector('.fbar');
  function fit(){
    var vw=window.innerWidth,vh=window.innerHeight,best=null;
    app.style.transform='none';
    for(var m=0;m<1;m++){
      app.classList.toggle('stack',m===1);
      var W=app.offsetWidth,H=app.offsetHeight;
      if(H>maxH[m])maxH[m]=H;
      var k=Math.min(vw/W,vh/maxH[m],2.5);
      if(!best||k>best.k+0.001)best={m:m,k:k,W:W};
    }
    app.classList.toggle('stack',best.m===1);
    app.style.transform='scale('+best.k+')';
    app.style.left=Math.max(0,(vw-best.W*best.k)/2)+'px';
    var a=topBar.offsetHeight*best.k,b2=a+fbar.offsetHeight*best.k;
    document.body.style.background='linear-gradient(to bottom,#217346 0,#217346 '+a+'px,#fff '+a+'px,#fff '+b2+'px,#bbb '+b2+'px,#bbb '+(b2+1)+'px,#eef3ef '+(b2+1)+'px)';
  }
  function sched(){cancelAnimationFrame(raf);raf=requestAnimationFrame(fit)}
  window.addEventListener('resize',sched);
  window.addEventListener('orientationchange',sched);
  window.addEventListener('load',sched);
  if(window.ResizeObserver)new ResizeObserver(sched).observe(app);
  fit();
})();
</script>
</body>
</html>
