<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Παζλ στα κελιά του Excel</title>
<style>
*{box-sizing:border-box}
html{height:100%}
body{height:100%;overflow:hidden;margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#eef3ef;color:#222;-webkit-user-select:none;user-select:none}
#app{position:absolute;left:0;top:0;width:1130px;transform-origin:0 0}
.top{background:#217346;color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:21px;margin:0;flex:1;min-width:240px}
.top label{font-size:14px}
.top select,.top button{font-size:15px;padding:6px 10px;border-radius:6px;border:0;font-family:inherit}
.top button{background:#ffd93b;font-weight:700;cursor:pointer}
.car{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.15);padding:4px 8px;border-radius:12px}
.top .car button{width:34px;height:34px;font-size:26px;line-height:1;padding:0;background:#fff;border-radius:50%;cursor:pointer;font-weight:700;color:#217346}
#thumb svg{width:96px;height:54px;display:block;border-radius:4px;border:2px solid #fff;background:#fff}
.cinfo{min-width:120px}
#ctitle{font-size:14px;font-weight:700;text-align:center}
#dots{display:flex;gap:6px;justify-content:center;margin-top:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.4);cursor:pointer}
.dot.on{background:#ffd93b}
.top button.fsbtn{background:transparent;width:40px;height:40px;padding:6px;border:2px solid rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;cursor:pointer}
.top button.fsbtn:hover{background:rgba(255,255,255,.2)}
.fbar{display:flex;align-items:center;background:#fff;border-bottom:1px solid #bbb;min-height:36px}
#namebox{width:90px;text-align:center;border-right:1px solid #ccc;font-weight:700;line-height:36px;font-size:16px}
.fx{padding:0 12px;font-style:italic;color:#217346;font-weight:700;border-right:1px solid #ccc;line-height:36px}
#msg{padding:4px 14px;font-size:16px;font-weight:600;flex:1;color:#333}
#msg.ok{color:#14702f}
#msg.err{color:#c0262d}
.main{display:flex;flex-wrap:nowrap;gap:24px;padding:18px;align-items:flex-start}
#sheet{position:relative;display:grid;grid-template-columns:40px repeat(10,60px);grid-template-rows:24px repeat(9,40px);background:#fff;border:1px solid #aaa;width:max-content}
.hd{background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;box-shadow:inset -1px -1px 0 #c8c8c8}
.hd.hl{background:#cfe3d6;color:#0b5b2a}
.cell{position:relative;box-shadow:inset -1px -1px 0 #d8d8d8}
.cell.over{background:#c8f0d2;outline:3px solid #217346;outline-offset:-3px;z-index:2}
.cell.bad{background:#ffc9c9;outline:3px solid #d33;outline-offset:-3px;z-index:2}
.cell svg{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#range{position:absolute;border:3px dashed #217346;pointer-events:none;z-index:3}
#trayWrap{flex:none;width:424px;background:#fffbe8;border:2px dashed #e0b800;border-radius:12px;padding:10px 12px}
#trayWrap h2{margin:0 0 10px;font-size:18px}
#trayWrap p{margin:0 0 10px;font-size:14px;color:#555}
#tray{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-content:flex-start}
.piece{width:60px;background:#fff;box-shadow:0 0 0 1px #777,0 3px 6px rgba(0,0,0,.3);cursor:grab;touch-action:none}
.piece svg{display:block;width:60px;height:40px}
.lab{height:26px;background:#fff3a0;font-size:18px;font-weight:800;text-align:center;line-height:26px;color:#222}
.lab.two{height:32px;font-size:10.5px;line-height:15px;padding-top:1px}
.piece.dragging{position:fixed;z-index:1000;cursor:grabbing;transform:scale(1.1)!important;box-shadow:0 0 0 1px #333,0 10px 20px rgba(0,0,0,.4);margin:0}
.ph{visibility:hidden}
#win{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;align-items:center;justify-content:center}
#win .box{background:#fff;border-radius:16px;padding:28px 40px;text-align:center;max-width:90vw}
#win h2{font-size:36px;margin:0 0 8px;color:#217346}
#win p{font-size:18px;margin:0 0 16px}
#win button{font-size:17px;padding:8px 18px;border-radius:8px;border:0;background:#217346;color:#fff;font-weight:700;cursor:pointer;margin:0 6px;font-family:inherit}
#win button.sec{background:#ddd;color:#222}
</style>
</head>
<body>
<div id="app">
<div class="top">
  <h1>🧩 Παζλ στα κελιά του Excel</h1>
  <div class="car">
    <button id="prev" title="Προηγούμενη εικόνα">‹</button>
    <div class="cinfo"><div id="ctitle"></div><div id="dots"></div></div>
    <button id="next" title="Επόμενη εικόνα">›</button>
  </div>
  <input type="hidden" id="lvl" value="1">
  <button id="again">Νέο παζλ</button>
  <button id="fs" class="fsbtn" aria-label="Πλήρης οθόνη"></button>
</div>
<div class="fbar">
  <div id="namebox">—</div>
  <div class="fx">fx</div>
  <div id="msg"></div>
</div>
<div class="main">
  <div>
    <div id="sheet"></div>
    <div id="counter" style="margin-top:8px;font-size:16px;font-weight:700"></div>
  </div>
  <div id="trayWrap">
    <h2>Κομμάτια του παζλ</h2>
    <p id="help" style="display:none"></p>
    <div id="tray"></div>
  </div>
</div>
</div>
<div id="win">
  <div class="box">
    <h2>🎉 Μπράβο!</h2>
    <p>Συμπλήρωσες όλα τα κελιά και το παζλ ολοκληρώθηκε!</p>
    <button id="winAgain">Παίξε ξανά</button>
    <button id="winClose" class="sec">Κλείσιμο</button>
  </div>
</div>

<script>

s4+='<circle cx="340" cy="75" r="26" fill="#f4b860"/><ellipse cx="340" cy="75" rx="46" ry="11" fill="none" stroke="#e8d28a" stroke-width="5" transform="rotate(-20 340 75)"/>'+

 '<path d="M216 40 Q232 62 238 78 L194 78 Q200 62 216 40Z" fill="#e74c3c"/>'+

 '<polygon points="390,178 394,187 404,188 396,194 399,204 390,199 381,204 384,194 376,188 386,187" fill="#ffd93b"/>';

/* Φάρμα */

 '<ellipse cx="100" cy="200" rx="200" ry="70" fill="#8fd36e"/><ellipse cx="340" cy="210" rx="200" ry="70" fill="#7ddc6b"/><rect y="195" width="432" height="45" fill="#6cc95a"/>'+

 '<rect x="75" y="145" width="40" height="50" fill="#f6e3c5" stroke="#fff" stroke-width="2"/><path d="M75 145 L115 195 M115 145 L75 195" stroke="#fff" stroke-width="3"/><circle cx="95" cy="100" r="8" fill="#f6e3c5"/>'+

for(let fx=206;fx<432;fx+=32)s5+='<rect x="'+fx+'" y="166" width="8" height="32" fill="#fff" stroke="#ccc"/>';

const scenes=[s1,s2,s3,s4,s5,s6];
const names=['Το σπίτι','Η θάλασσα','Το ουράνιο τόξο','Το διάστημα','Η φάρμα','Το τρένο'];
function svgFor(x,y,scene){
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+x+' '+y+' '+SW+' '+SH+'" preserveAspectRatio="none">'+scenes[scene]+'</svg>';

/* ---------- Φύλλο ---------- */
const sheet=document.getElementById('sheet');
const tray=document.getElementById('tray');
const msg=document.getElementById('msg');
const namebox=document.getElementById('namebox');
const counter=document.getElementById('counter');
const help=document.getElementById('help');
const winEl=document.getElementById('win');
const ctitle=document.getElementById('ctitle');
const dots=document.getElementById('dots');
let picIdx=0;
function renderCar(){
  ctitle.textContent='Εικόνα '+(picIdx+1)+' από '+scenes.length;
  dots.innerHTML='';
  scenes.forEach(function(_,i){
    const d=document.createElement('span');d.className='dot'+(i===picIdx?' on':'');
    d.addEventListener('click',function(){picIdx=i;newGame();});
    dots.appendChild(d);
  });
}
const lvlSel=document.getElementById('lvl');
const colH=[],rowH=[],cells=[];

sheet.appendChild(el('hd',''));
for(let c=0;c<COLS;c++){const h=el('hd',L(c));colH.push(h);sheet.appendChild(h);}
for(let r=0;r<ROWS;r++){
  const rh=el('hd',String(r+1));rowH.push(rh);sheet.appendChild(rh);
  cells[r]=[];
  for(let c=0;c<COLS;c++){
    const d=el('cell');d.dataset.c=c;d.dataset.r=r;d.dataset.addr=L(c)+(r+1);
    cells[r][c]=d;sheet.appendChild(d);
  }
}
const range=document.createElement('div');range.id='range';
range.style.left=(40+PX*CW)+'px';range.style.top=(24+PY*CH)+'px';
range.style.width=(PC*CW)+'px';range.style.height=(PR*CH)+'px';
sheet.appendChild(range);

function setName(c){
  colH.concat(rowH).forEach(function(h){h.classList.remove('hl')});
  if(c){
    namebox.textContent=c.dataset.addr;
    colH[+c.dataset.c].classList.add('hl');
    rowH[+c.dataset.r].classList.add('hl');
  }else{namebox.textContent='—';}
}
sheet.addEventListener('mouseover',function(e){
  if(drag)return;
  const c=e.target.closest&&e.target.closest('.cell');
  setName(c||null);
});
sheet.addEventListener('mouseleave',function(){if(!drag)setName(null)});

function say(text,cls){msg.textContent=text;msg.className=cls||''}
function updateCount(){counter.textContent='Κομμάτια στη θέση τους: '+placed+' από '+(PC*PR)}

let placed=0,drag=null,level=1;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}

function newGame(){
  placed=0;drag=null;winEl.style.display='none';
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const d=cells[r][c];d.innerHTML='';d.className='cell';}
  tray.innerHTML='';
  level=+lvlSel.value;const scene=picIdx;renderCar();
  range.style.display=level===1?'block':'none';
  help.textContent='';
  const list=[];
  for(let r=0;r<PR;r++)for(let c=0;c<PC;c++)list.push({r:r,c:c});
  shuffle(list).forEach(function(o){
    const col=PX+o.c,row=PY+o.r,addr=L(col)+(row+1);
    const p=el('piece');p.dataset.addr=addr;p.dataset.c=col;p.dataset.r=row;
    p.innerHTML=svgFor(o.c*SW,o.r*SH,scene)+'<div class="lab'+(level===2?' two':'')+'">'+
      (level===1?addr:'Στήλη '+L(col)+'<br>Γραμμή '+(row+1))+'</div>';
    p.style.transform='rotate('+(Math.random()*10-5).toFixed(1)+'deg)';
    tray.appendChild(p);
  });
  updateCount();setName(null);
  say('');
}

/* ---------- Σύρσιμο ---------- */
function cellUnder(p){
  const r=p.getBoundingClientRect();
  const x=r.left+r.width/2,y=r.top+(r.width*CH/CW)/2;
  const els=document.elementsFromPoint(x,y);
  for(let i=0;i<els.length;i++){if(els[i].classList&&els[i].classList.contains('cell'))return els[i];}
  return null;
}
const appEl=document.getElementById('app');
function appK(){return appEl.getBoundingClientRect().width/appEl.offsetWidth||1}
function toLocal(x,y){const ar=appEl.getBoundingClientRect(),k=ar.width/appEl.offsetWidth||1;return {x:(x-ar.left)/k,y:(y-ar.top)/k}}
tray.addEventListener('pointerdown',function(e){
  if(e.button!==undefined&&e.button!==0)return;
  const p=e.target.closest('.piece');if(!p||drag)return;
  e.preventDefault();
  const rect=p.getBoundingClientRect();
  const ph=document.createElement('div');ph.className='ph';
  ph.style.width=p.offsetWidth+'px';ph.style.height=p.offsetHeight+'px';
  p.parentNode.insertBefore(ph,p);
  const ap=toLocal(rect.left,rect.top);p.style.left=ap.x+'px';p.style.top=ap.y+'px';
  p.classList.add('dragging');
  drag={p:p,ph:ph,dx:(e.clientX-rect.left)/appK(),dy:(e.clientY-rect.top)/appK(),over:null};
  document.addEventListener('pointermove',onMove);
  document.addEventListener('pointerup',onUp);
  document.addEventListener('pointercancel',onUp);
});
function onMove(e){
  if(!drag)return;
  const p=drag.p;
  const lp=toLocal(e.clientX,e.clientY);p.style.left=(lp.x-drag.dx)+'px';p.style.top=(lp.y-drag.dy)+'px';
  const c=cellUnder(p);
  if(drag.over&&drag.over!==c)drag.over.classList.remove('over');
  if(c&&!c.classList.contains('filled'))c.classList.add('over');
  drag.over=c;setName(c);
}
function hint(c,p){
  let h='Αυτό είναι το κελί '+c.dataset.addr+'. ';
  if(c.dataset.c===p.dataset.c)h+='Σωστή στήλη! Έλεγξε τον αριθμό της γραμμής.';
  else if(c.dataset.r===p.dataset.r)h+='Σωστή γραμμή! Έλεγξε το γράμμα της στήλης.';
  else h+='Κοίτα καλά το γράμμα της στήλης και τον αριθμό της γραμμής.';
  return h;
}
function onUp(){
  if(!drag)return;
  document.removeEventListener('pointermove',onMove);
  document.removeEventListener('pointerup',onUp);
  document.removeEventListener('pointercancel',onUp);
  const p=drag.p,ph=drag.ph;
  const c=cellUnder(p);
  if(drag.over)drag.over.classList.remove('over');
  drag=null;
  p.classList.remove('dragging');p.style.left='';p.style.top='';
  let ok=false;
  if(c&&c.classList.contains('filled')){
    say('Το κελί '+c.dataset.addr+' έχει ήδη κομμάτι. Δοκίμασε άλλο κελί.','err');
  }else if(c&&c.dataset.addr===p.dataset.addr){
    c.innerHTML=p.querySelector('svg').outerHTML;
    c.classList.add('filled');
    ph.remove();p.remove();ok=true;placed++;updateCount();
    say('Μπράβο! Το κομμάτι μπήκε στο κελί '+c.dataset.addr+'.','ok');
    if(placed===PC*PR){setTimeout(function(){winEl.style.display='flex'},500);say('Το παζλ ολοκληρώθηκε! 🎉','ok');}
  }else if(c){
    c.classList.add('bad');setTimeout(function(){c.classList.remove('bad')},800);
    say(hint(c,p),'err');
  }else{
    say('Άφησε το κομμάτι πάνω σε ένα κελί του φύλλου.','err');
  }
  if(!ok)ph.replaceWith(p);
  setName(null);
}

document.getElementById('again').addEventListener('click',newGame);
document.getElementById('winAgain').addEventListener('click',newGame);
document.getElementById('winClose').addEventListener('click',function(){winEl.style.display='none'});
document.getElementById('prev').addEventListener('click',function(){picIdx=(picIdx+scenes.length-1)%scenes.length;newGame();});
document.getElementById('next').addEventListener('click',function(){picIdx=(picIdx+1)%scenes.length;newGame();});
lvlSel.addEventListener('change',newGame);
newGame();
})();
</script>
<script>
(function(){
  var b=document.getElementById('fs');
  var expand='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
  var compress='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
  function isFs(){return document.fullscreenElement||document.webkitFullscreenElement}
  function upd(){b.innerHTML=isFs()?compress:expand}
  b.addEventListener('click',function(){
    var d=document,e=d.documentElement,r;
    try{
      if(isFs()){r=(d.exitFullscreen||d.webkitExitFullscreen).call(d)}
      else{r=(e.requestFullscreen||e.webkitRequestFullscreen).call(e)}
      if(r&&r.catch)r.catch(function(){});
    }catch(err){}
  });
  document.addEventListener('fullscreenchange',upd);
  document.addEventListener('webkitfullscreenchange',upd);
  upd();
})();
</script>
<script>
(function(){
  var app=document.getElementById('app'),maxH=0;
  function fit(){
    app.style.transform='none';
    var W=app.offsetWidth,H=app.offsetHeight;
    if(H>maxH)maxH=H;
    var vw=window.innerWidth,vh=window.innerHeight;
    var k=Math.min(vw/W,vh/maxH,2);
    app.style.transform='scale('+k+')';
    app.style.left=Math.max(0,(vw-W*k)/2)+'px';
    var a=app.querySelector('.top').offsetHeight*k,b2=a+app.querySelector('.fbar').offsetHeight*k;
    document.body.style.background='linear-gradient(to bottom,#217346 0,#217346 '+a+'px,#fff '+a+'px,#fff '+b2+'px,#bbb '+b2+'px,#bbb '+(b2+1)+'px,#eef3ef '+(b2+1)+'px)';
  }
  window.addEventListener('resize',fit);
  window.addEventListener('load',fit);
  if(window.ResizeObserver)new ResizeObserver(fit).observe(app);
  fit();
})();
</script>
