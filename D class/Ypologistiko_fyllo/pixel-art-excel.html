<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Art στα κελιά του Excel</title>
<style>
*{box-sizing:border-box}
html{height:100%;overflow:hidden;overscroll-behavior:none}
body{height:100%;overflow:hidden;margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#eef3ef;color:#222;-webkit-user-select:none;user-select:none}
#app{position:absolute;left:0;top:0;width:1000px;transform-origin:0 0}
.top{background:#217346;color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:21px;margin:0;flex:1;min-width:240px}
.top label{font-size:14px}
.top select,.top button{font-size:15px;padding:6px 10px;border-radius:6px;border:0;font-family:inherit}
.top button{background:#ffd93b;font-weight:700;cursor:pointer}
.car{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.15);padding:4px 8px;border-radius:12px}
.top .car button{width:34px;height:34px;font-size:26px;line-height:1;padding:0;background:#fff;border-radius:50%;cursor:pointer;font-weight:700;color:#217346}
.cinfo{min-width:130px}
#ctitle{font-size:14px;font-weight:700;text-align:center}
#dots{display:flex;gap:6px;justify-content:center;margin-top:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.4);cursor:pointer}
.dot.on{background:#ffd93b}
.top button.fsbtn{background:transparent;width:40px;height:40px;padding:6px;border:2px solid rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;cursor:pointer}
.top button.fsbtn:hover{background:rgba(255,255,255,.2)}
.fbar{display:flex;align-items:center;background:#fff;border-bottom:1px solid #bbb;min-height:36px}
#namebox{width:90px;text-align:center;border-right:1px solid #ccc;font-weight:700;line-height:36px;font-size:16px}
.fx{padding:0 12px;font-style:italic;color:#217346;font-weight:700;border-right:1px solid #ccc;line-height:36px}
#msg{padding:4px 14px;font-size:16px;font-weight:600;flex:1;color:#333}
#msg.ok{color:#14702f}
#msg.err{color:#c0262d}
.main{display:flex;flex-wrap:nowrap;gap:16px;padding:16px;align-items:flex-start;justify-content:center}
#palette{display:grid;grid-template-columns:repeat(2,64px);gap:6px;flex:none}
.sw{width:64px;padding:4px 2px 3px;background:#fff;border:3px solid transparent;border-radius:8px;text-align:center;cursor:pointer;font-size:11.5px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw i{display:block;height:24px;border-radius:5px;margin-bottom:2px;border:1px solid rgba(0,0,0,.35)}
.sw.sel{border-color:#217346;background:#e6f5ea}
.sw.eraser i{background:repeating-linear-gradient(45deg,#fff,#fff 5px,#e0e0e0 5px,#e0e0e0 10px)}
#sheet{position:relative;display:grid;grid-template-columns:36px repeat(10,46px);grid-template-rows:24px repeat(10,34px);background:#fff;border:1px solid #aaa;width:max-content;touch-action:none}
.hd{background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;box-shadow:inset -1px -1px 0 #c8c8c8}
.hd.hl{background:#cfe3d6;color:#0b5b2a}
.cell{position:relative;box-shadow:inset -1px -1px 0 #cfcfcf;cursor:crosshair}
.cell.hint{outline:3px solid #ff9800;outline-offset:-3px;z-index:2}
.cell.wrong{outline:3px solid #d32f2f;outline-offset:-3px;z-index:2}
#counter{margin-top:8px;font-size:16px;font-weight:700}
#instr{flex:1;min-width:0;background:#fffbe8;border:2px dashed #e0b800;border-radius:12px;padding:10px 14px}
#instr h2{margin:0 0 2px;font-size:18px}
#instr p{margin:0 0 8px;font-size:14px;color:#555}
#groups{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.gh{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:15px;margin:0 6px 0 0;white-space:nowrap}
.gh:first-child{margin-left:0}
.gh i{display:inline-block;width:17px;height:17px;border-radius:4px;border:1px solid rgba(0,0,0,.4)}
.chip{background:#fff;border:2px solid #999;border-radius:6px;padding:0 3px;font-size:15px;font-weight:700;line-height:20px;cursor:pointer}
.chip.done{background:#d4f4da;border-color:#2e9b4f!important;color:#14702f}
#win{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;align-items:center;justify-content:center}
#win .box{background:#fff;border-radius:16px;padding:28px 40px;text-align:center;max-width:90vw}
#win h2{font-size:36px;margin:0 0 8px;color:#217346}
#win p{font-size:18px;margin:0 0 16px}
#win button{font-size:17px;padding:8px 18px;border-radius:8px;border:0;background:#217346;color:#fff;font-weight:700;cursor:pointer;margin:0 6px;font-family:inherit}
#win button.sec{background:#ddd;color:#222}
#app.stack{width:560px}
#app.stack .main{flex-direction:column;align-items:center;gap:12px;padding:12px}
#app.stack #palette{grid-template-columns:repeat(6,64px)}
#app.stack #instr{flex:none;width:100%;max-height:none;overflow:visible}
</style>
</head>
<body>
<div id="app">
<div class="top">
  <h1>🎨 Pixel Art στα κελιά του Excel</h1>
  <div class="car">
    <button id="prev" title="Προηγούμενη εικόνα">‹</button>
    <div class="cinfo"><div id="ctitle"></div><div id="dots"></div></div>
    <button id="next" title="Επόμενη εικόνα">›</button>
  </div>
  <input type="hidden" id="mode" value="cells">
  <button id="check">Έλεγχος</button>
  <button id="clear">Καθαρισμός</button>
  <button id="fs" class="fsbtn" aria-label="Πλήρης οθόνη"></button>
</div>
<div class="fbar">
  <div id="namebox">—</div>
  <div class="fx">fx</div>
  <div id="msg"></div>
</div>
<div class="main">
  <div id="palette"></div>
  <div>
    <div id="sheet"></div>
    <div id="counter"></div>
  </div>
  <div id="instr">
    <h2 id="ititle"></h2>
    <div id="groups"></div>
  </div>
</div>
</div>
<div id="win">
  <div class="box">
    <h2>🎉 Μπράβο!</h2>
    <p>Ολοκλήρωσες την εικόνα με τα σωστά χρώματα στα σωστά κελιά!</p>
    <button id="winNext">Επόμενη εικόνα</button>
    <button id="winClose" class="sec">Κλείσιμο</button>
  </div>
</div>

<script>
(function(){
let COLS=10, ROWS=10;
const L=function(i){return String.fromCharCode(65+i)};
function el(tag,cls,txt){const d=document.createElement(tag);if(cls)d.className=cls;if(txt!==undefined)d.textContent=txt;return d}

const COLORS={
  R:['Κόκκινο','#e53935'], O:['Πορτοκαλί','#fb8c00'], Y:['Κίτρινο','#fdd835'], G:['Πράσινο','#43a047'],
  L:['Γαλάζιο','#4fc3f7'], B:['Μπλε','#1e56c8'], N:['Καφέ','#8d5524'], K:['Μαύρο','#222222'],
  P:['Ροζ','#f8a5c8'], V:['Μωβ','#8e44ad'], S:['Γκρι','#a8a8a8']
};
const ORDER=['R','O','Y','G','L','B','N','K','S','P','V'];

const IMAGES=[
 {name:'Το ανθρωπάκι',rows:['..KKK..','..PPP..','..PPP..','...P...','PRRRRRP','..RRR..','..RRR..','..SYS..','..LLL..','..L.L..','..L.L..','.KK.KK.']},
 {name:'Το ρομπότ',rows:['...R...','...S...','.SSSSS.','.SLSLS.','.SSSSS.','.SKKKS.','...S...','SSSSSSS','S.SBS.S','.SSSSS.','..S.S..','.KK.KK.']},
 {name:'Η πεταλούδα',rows:['.K......K.','..K.KK.K..','VVV.KK.VVV','VPPVKKVPPV','VPPVKKVPPV','.VVVKKVVV.','.OOOKKOOO.','OOYOKKOYOO','.OOOKKOOO.','..O.KK.O..']}
];

/* ---------- Φύλλο ---------- */
const sheet=document.getElementById('sheet');
const msg=document.getElementById('msg');
const namebox=document.getElementById('namebox');
const counter=document.getElementById('counter');
const groupsEl=document.getElementById('groups');
const winEl=document.getElementById('win');
const modeSel=document.getElementById('mode');
const colH=[],rowH=[],cells=[];
function buildSheet(){
  sheet.innerHTML='';colH.length=0;rowH.length=0;cells.length=0;
  COLS=IMAGES[idx].rows[0].length;ROWS=IMAGES[idx].rows.length;
  sheet.style.gridTemplateColumns='36px repeat('+COLS+',46px)';
  sheet.style.gridTemplateRows='24px repeat('+ROWS+',34px)';
  sheet.appendChild(el('div','hd'));
  for(let c=0;c<COLS;c++){const h=el('div','hd',L(c));colH.push(h);sheet.appendChild(h);}
  for(let r=0;r<ROWS;r++){
    const rh=el('div','hd',String(r+1));rowH.push(rh);sheet.appendChild(rh);
    cells[r]=[];
    for(let c=0;c<COLS;c++){
      const d=el('div','cell');d.dataset.r=r;d.dataset.c=c;d.dataset.addr=L(c)+(r+1);
      cells[r][c]=d;sheet.appendChild(d);
    }
  }
}
function setName(c){
  colH.concat(rowH).forEach(function(h){h.classList.remove('hl')});
  if(c){namebox.textContent=c.dataset.addr;colH[+c.dataset.c].classList.add('hl');rowH[+c.dataset.r].classList.add('hl');}
  else namebox.textContent='—';
}
function say(t,cls){msg.textContent=t;msg.className=cls||''}

/* ---------- Παλέτα ---------- */
const paletteEl=document.getElementById('palette');
let cur='R';
const swEls={};
ORDER.forEach(function(k){
  const b=el('div','sw');b.dataset.k=k;
  const i=document.createElement('i');i.style.background=COLORS[k][1];
  b.appendChild(i);b.appendChild(document.createTextNode(COLORS[k][0]));
  b.addEventListener('click',function(){selectColor(k)});
  paletteEl.appendChild(b);swEls[k]=b;
});
const er=el('div','sw eraser');er.dataset.k='';
const ei=document.createElement('i');er.appendChild(ei);er.appendChild(document.createTextNode('Γόμα'));
er.addEventListener('click',function(){selectColor('')});
paletteEl.appendChild(er);swEls['']=er;
function selectColor(k){
  cur=k;
  Object.keys(swEls).forEach(function(x){swEls[x].classList.toggle('sel',x===k)});
}
selectColor('R');

/* ---------- Κατάσταση ---------- */
let idx=0,state=[],chips=[],won=false,painting=false;
function resetState(){
  state=[];
  for(let r=0;r<ROWS;r++){state[r]=[];for(let c=0;c<COLS;c++){state[r][c]='';cells[r][c].style.background='';cells[r][c].classList.remove('wrong','hint');}}
  won=false;
}
function expected(r,c){const ch=IMAGES[idx].rows[r][c];return ch==='.'?'':ch}

function paint(cell){
  if(!cell)return;
  const r=+cell.dataset.r,c=+cell.dataset.c;
  state[r][c]=cur;
  cell.style.background=cur?COLORS[cur][1]:'';
  cell.classList.remove('wrong');
  updateAll();
}
function cellFromEvent(e){
  const t=document.elementFromPoint(e.clientX,e.clientY);
  return t&&t.closest?t.closest('.cell'):null;
}
sheet.addEventListener('pointerdown',function(e){
  const c=e.target.closest('.cell');
  if(!c)return;
  e.preventDefault();painting=true;paint(c);setName(c);
});
document.addEventListener('pointermove',function(e){
  const c=cellFromEvent(e);
  if(c&&sheet.contains(c)){setName(c);if(painting)paint(c);}
});
document.addEventListener('pointerup',function(){painting=false});
document.addEventListener('pointercancel',function(){painting=false});
sheet.addEventListener('mouseleave',function(){if(!painting)setName(null)});

/* ---------- Οδηγίες ---------- */
function buildInstructions(){
  groupsEl.innerHTML='';chips=[];
  const img=IMAGES[idx];
  document.getElementById('ititle').textContent='Οδηγίες';
  const mode=modeSel.value;
  ORDER.forEach(function(k){
    const items=[];
    for(let r=0;r<ROWS;r++){
      let c=0;
      while(c<COLS){
        if(img.rows[r][c]===k){
          let e=c;
          if(mode==='ranges'){while(e+1<COLS&&img.rows[r][e+1]===k)e++;}
          items.push({r:r,c1:c,c2:e});
          c=e+1;
        }else c++;
      }
    }
    if(!items.length)return;
    const gh=el('div','gh');
    const sw=document.createElement('i');sw.style.background=COLORS[k][1];
    gh.appendChild(sw);gh.appendChild(document.createTextNode(COLORS[k][0]));
    if(groupsEl.children.length){const br=document.createElement('span');br.style.flexBasis='100%';br.style.height='4px';groupsEl.appendChild(br);}
    groupsEl.appendChild(gh);
    items.forEach(function(it){
      const label=it.c1===it.c2?L(it.c1)+(it.r+1):L(it.c1)+(it.r+1)+':'+L(it.c2)+(it.r+1);
      const chip=el('span','chip',label);
      const list=[];for(let c=it.c1;c<=it.c2;c++)list.push([it.r,c]);
      chip.addEventListener('mouseenter',function(){list.forEach(function(p){cells[p[0]][p[1]].classList.add('hint')})});
      chip.addEventListener('mouseleave',function(){list.forEach(function(p){cells[p[0]][p[1]].classList.remove('hint')})});
      chip.addEventListener('click',function(){selectColor(k)});
      chip.style.borderColor=COLORS[k][1];groupsEl.appendChild(chip);
      chips.push({el:chip,label:label,k:k,list:list});
    });
    
  });
}

function stats(){
  let total=0,good=0,wrong=0;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const ex=expected(r,c),st=state[r][c];
    if(ex)total++;
    if(ex&&st===ex)good++;
    else if(st&&st!==ex)wrong++;
  }
  return {total:total,good:good,wrong:wrong};
}
function updateAll(){
  chips.forEach(function(ch){
    const done=ch.list.every(function(p){return state[p[0]][p[1]]===ch.k});
    ch.el.classList.toggle('done',done);
    ch.el.textContent=ch.label+(done?' ✓':'');
  });
  const s=stats();
  counter.textContent='Σωστά κελιά: '+s.good+' από '+s.total;
  const complete=s.good===s.total&&s.wrong===0;
  if(complete&&!won){won=true;say('Η εικόνα ολοκληρώθηκε! 🎉','ok');setTimeout(function(){winEl.style.display='flex'},500);}
  if(!complete)won=false;
}

/* ---------- Καρουζέλ ---------- */
const dots=document.getElementById('dots');
const ctitle=document.getElementById('ctitle');
function renderCar(){
  ctitle.textContent='Εικόνα '+(idx+1)+' από '+IMAGES.length;
  dots.innerHTML='';
  IMAGES.forEach(function(_,i){
    const d=document.createElement('span');d.className='dot'+(i===idx?' on':'');
    d.addEventListener('click',function(){go(i)});
    dots.appendChild(d);
  });
}
function go(i){
  idx=(i+IMAGES.length)%IMAGES.length;
  winEl.style.display='none';
  buildSheet();resetState();renderCar();buildInstructions();updateAll();setName(null);
  say('');
}

document.getElementById('prev').addEventListener('click',function(){go(idx-1)});
document.getElementById('next').addEventListener('click',function(){go(idx+1)});
document.getElementById('winNext').addEventListener('click',function(){go(idx+1)});
document.getElementById('winClose').addEventListener('click',function(){winEl.style.display='none'});
document.getElementById('clear').addEventListener('click',function(){resetState();updateAll();say('Το φύλλο καθαρίστηκε. Ξεκίνα ξανά!')});
modeSel.addEventListener('change',function(){buildInstructions();updateAll()});

document.getElementById('check').addEventListener('click',function(){
  const wrongCells=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const st=state[r][c];
    if(st&&st!==expected(r,c))wrongCells.push(cells[r][c]);
  }
  const s=stats();
  if(wrongCells.length){
    wrongCells.forEach(function(d){d.classList.add('wrong')});
    setTimeout(function(){wrongCells.forEach(function(d){d.classList.remove('wrong')})},2500);
    say('Βρήκα '+wrongCells.length+' κελιά με λάθος χρώμα (κόκκινα πλαίσια). Έλεγξε ξανά τις οδηγίες!','err');
  }else if(s.good<s.total){
    say('Όσα έχεις βάψει είναι σωστά! Λείπουν ακόμα '+(s.total-s.good)+' κελιά.','ok');
  }else{
    say('Όλα είναι σωστά! 🎉','ok');
  }
});

go(0);
})();
</script>
<script>
(function(){
  var b=document.getElementById('fs');
  var expand='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
  var compress='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
  function isFs(){return document.fullscreenElement||document.webkitFullscreenElement}
  function upd(){b.innerHTML=isFs()?compress:expand}
  b.addEventListener('click',function(){
    var d=document,e=d.documentElement,r;
    try{
      if(isFs()){r=(d.exitFullscreen||d.webkitExitFullscreen).call(d)}
      else{r=(e.requestFullscreen||e.webkitRequestFullscreen).call(e)}
      if(r&&r.catch)r.catch(function(){});
    }catch(err){}
  });
  document.addEventListener('fullscreenchange',upd);
  document.addEventListener('webkitfullscreenchange',upd);
  upd();
})();
</script>
<script>
(function(){
  var app=document.getElementById('app'),maxH=[0,0],raf=0;
  var topBar=app.querySelector('.top'),fbar=app.querySelector('.fbar');
  function fit(){
    var vw=window.innerWidth,vh=window.innerHeight,best=null;
    app.style.transform='none';
    for(var m=0;m<2;m++){
      app.classList.toggle('stack',m===1);
      var W=app.offsetWidth,H=app.offsetHeight;
      if(H>maxH[m])maxH[m]=H;
      var k=Math.min(vw/W,vh/maxH[m],2.5);
      if(!best||k>best.k+0.001)best={m:m,k:k,W:W};
    }
    app.classList.toggle('stack',best.m===1);
    app.style.transform='scale('+best.k+')';
    app.style.left=Math.max(0,(vw-best.W*best.k)/2)+'px';
    var a=topBar.offsetHeight*best.k,b2=a+fbar.offsetHeight*best.k;
    document.body.style.background='linear-gradient(to bottom,#217346 0,#217346 '+a+'px,#fff '+a+'px,#fff '+b2+'px,#bbb '+b2+'px,#bbb '+(b2+1)+'px,#eef3ef '+(b2+1)+'px)';
  }
  function sched(){cancelAnimationFrame(raf);raf=requestAnimationFrame(fit)}
  window.addEventListener('resize',sched);
  window.addEventListener('orientationchange',sched);
  window.addEventListener('load',sched);
  if(window.ResizeObserver)new ResizeObserver(sched).observe(app);
  fit();
})();
</script>
</body>
</html>
